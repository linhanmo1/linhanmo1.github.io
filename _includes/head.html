
<style>
/* 全屏彩球画布，层级最高不遮挡页面内容 */
#click-ball-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 9999;
}
</style>
<canvas id="click-ball-canvas"></canvas>
<script>
const canvas = document.getElementById('click-ball-canvas');
const ctx = canvas.getContext('2d');

// 自适应窗口大小
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// 彩球数组与随机颜色池
let balls = [];
const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffeaa7', '#fd79a8', '#a29bfe'];

// 定义静态彩球类，移除抛物线和重力逻辑
class Ball {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.radius = Math.random() * 8 + 4; // 随机球大小 4-12px
    this.color = colors[Math.floor(Math.random() * colors.length)];
    // 仅实现水平方向极短距离扩散，没有下坠弹跳
    this.vx = (Math.random() - 0.5) * 4;
    this.vy = (Math.random() - 0.5) * 4;
    this.alpha = 1;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= 0.015; // 逐步淡出
  }

  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
    ctx.restore();
  }
}

// 点击生成彩球
canvas.addEventListener('click', (e) => {
  for (let i = 0; i < 15; i++) {
    balls.push(new Ball(e.clientX, e.clientY));
  }
});

// 动画循环渲染
function renderLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  balls = balls.filter(ball => ball.alpha > 0);
  balls.forEach(ball => {
    ball.update();
    ball.draw();
  });
  requestAnimationFrame(renderLoop);
}
renderLoop();
</script>
