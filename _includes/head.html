<!-- 点击彩球特效 Start -->
<style>
  /* 强制固定定位，确保覆盖全站，不随滚动条移动 */
  #particle-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none; /* 关键：让鼠标点击能穿透画布，不影响正常链接点击 */
    z-index: 99999;       /* 关键：确保在最顶层 */
    display: block;
  }
</style>
<canvas id="particle-canvas"></canvas>

<script>
(function() {
  const canvas = document.getElementById('particle-canvas');
  if (!canvas) return;
  
  const ctx = canvas.getContext('2d');
  let particles = [];
  
  // 初始化画布尺寸
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // 粒子类定义
  class Particle {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      // 随机大小 3-8px
      this.size = Math.random() * 5 + 3;
      // 随机向四周散开，无重力
      this.speedX = (Math.random() - 0.5) * 6;
      this.speedY = (Math.random() - 0.5) * 6;
      // 随机鲜艳颜色
      const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffeaa7', '#fd79a8', '#a29bfe'];
      this.color = colors[Math.floor(Math.random() * colors.length)];
      this.life = 1.0; // 生命值 1.0 -> 0
    }

    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      this.life -= 0.02; // 消失速度
      this.size *= 0.95; // 逐渐变小
    }

    draw() {
      ctx.fillStyle = this.color;
      ctx.globalAlpha = Math.max(0, this.life); // 防止负数报错
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0; // 重置透明度
    }
  }

  // 监听全局点击事件
  window.addEventListener('click', (e) => {
    // 每次点击生成 12 个粒子
    for (let i = 0; i < 12; i++) {
      particles.push(new Particle(e.clientX, e.clientY));
    }
  });

  // 动画循环
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 更新并绘制所有粒子
    for (let i = 0; i < particles.length; i++) {
      particles[i].update();
      particles[i].draw();
      
      // 移除消失的粒子
      if (particles[i].life <= 0) {
        particles.splice(i, 1);
        i--;
      }
    }
    requestAnimationFrame(animate);
  }
  
  // 启动动画
  animate();
})();
</script>
<!-- 点击彩球特效 End -->
