<script>
!function() {
    // 创建 Canvas 层
    var canvas = document.createElement("canvas");
    canvas.style.position = "fixed";
    canvas.style.top = "0";
    canvas.style.left = "0";
    canvas.style.width = "100%";
    canvas.style.height = "100%";
    canvas.style.zIndex = "99999";
    // 【关键代码】 pointer-events: none 让鼠标事件穿透 Canvas，完全不影响下方文字的选中和复制
    canvas.style.pointerEvents = "none"; 
    document.body.appendChild(canvas);

    var ctx = canvas.getContext("2d");
    var particles = [];
    
    // 调整 Canvas 大小
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 粒子类
    class Particle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 30 + 1;
            this.speedX = Math.random() * 8 - 4;
            this.speedY = Math.random() * 8 - 4;
            this.color = 'rgba(' + Math.floor(Math.random()*255) + ',' + Math.floor(Math.random()*255) + ',' + Math.floor(Math.random()*255) + ', 1)';
            this.life = 100;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= 2;
            this.size *= 0.95;
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // 监听全局点击，生成粒子
    // 注意：因为 Canvas 设置了 pointer-events: none，这里的监听需要加在 window 或 document 上
    window.addEventListener('click', function(e) {
        for (var i = 0; i < 10; i++) {
            particles.push(new Particle(e.clientX, e.clientY));
        }
    });

    // 动画循环
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (var i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].life <= 0) {
                particles.splice(i, 1);
                i--;
            }
        }
        requestAnimationFrame(animate);
    }
    animate();
}();
</script>
