  }

  draw_dino(fg, bg) {
    const c = this.ctx;
    const x = DINO_X;
    const by = this.dino_y;

    if (this.invincible > 0 && Math.floor(this.invincible * 20) % 2 === 0) fg = '#FFB74D';

    const char = DINO_CHARACTERS[this.dino_type];
    const accent = char.color;

    if (this.dash_time > 0) {
      const trail_col = hx(mix(this.night < 0.5 ? DAY_BG : NIGHT_BG,
                               this.night < 0.5 ? DAY_FG : NIGHT_FG, 0.35));
      for (let i = 0; i < 3; i++) {
        const tx = x - (i + 1) * 22;
        this.rect(tx, by - 46, tx + 22, by - 4, trail_col);
      }
    }

    if (this.ducking) {
      c.fillStyle = fg;
      c.fillRect(x - 16, by - 26, 22, 14);
      c.fillRect(x - 2, by - 32, 46, 24);
      c.fillRect(x + 36, by - 34, 28, 22);
      c.fillRect(x + 62, by - 24, 10, 6);
      c.fillStyle = bg;
      c.fillRect(x + 52, by - 29, 7, 7);
      c.fillStyle = fg;
      const phase = Math.floor(this.frame / 5) % 2;
      if (phase) {
        c.fillRect(x + 6, by - 10, 12, 10);
        c.fillRect(x + 26, by - 10, 12, 5);
      } else {
        c.fillRect(x + 6, by - 10, 12, 5);
        c.fillRect(x + 26, by - 10, 12, 10);
      }
    } else {
      c.fillStyle = fg;
      c.fillRect(x - 18, by - 38, 24, 14);
      c.fillRect(x + 2, by - 44, 32, 36);
      c.fillRect(x + 22, by - 60, 30, 30);
      c.fillRect(x + 50, by - 46, 14, 8);
      c.fillStyle = bg;
      c.fillRect(x + 40, by - 54, 7, 8);
      c.fillStyle = fg;
      c.fillRect(x + 30, by - 30, 10, 6);
      let lift;
      if (this.on_ground) {
        const lifts = [[0, 6], [0, 0], [6, 0], [0, 0]];
        lift = lifts[Math.floor(this.frame / 4) % 4];
      } else {
        lift = [4, 4];
      }
      c.fillRect(x + 6, by - 12, 11, 12 - lift[0]);
      c.fillRect(x + 21, by - 12, 11, 12 - lift[1]);
    }

    if (accent) {
      c.fillStyle = accent;
      c.fillRect(x + 4, by - 50, 4, 30);
    }

    if (this.shield_time > 0) {
      const r = 46 + Math.sin(this.frame * 0.3) * 3;
      this.oval(x + 25, by - 28, r, r, null, '#4FC3F7', 2);
    }
    if (this.magnet_time > 0) {
      const r = 60 + Math.sin(this.frame * 0.2) * 6;
      c.save();
      c.setLineDash([3, 4]);
      this.oval(x + 25, by - 28, r, r, null, '#FF5252', 1);
      c.restore();
    }
    if (this.x2_time > 0) {
      this.text('x2', x + 25, by - 80, 'bold 16px "Courier New",monospace', '#FFC107', 'center');
    }
    if (this.rainbow_time > 0) {
      const cols = ['#FF5252', '#FFC107', '#4FC3F7'];
      for (let i = 0; i < 3; i++) {
        const rr = 50 + i * 8 + Math.sin(this.frame * 0.2 + i) * 3;
        this.oval(x + 25, by - 28, rr, rr, null, cols[i], 2);
      }
    }

    if (this.weapon_cooldown > WEAPON_COOLDOWN - 0.08) {
      const mx = x + 50;
      const my = this.ducking ? (this.dino_y - 20) : (this.dino_y - 40);
      this.oval(mx, my, 6, 6, '#FFC107');
    }
  }

  draw_achievement_popup(fg_hex) {
    if (this.achievement_current === null) return;
    const key = this.achievement_current;
    const info = ACHIEVEMENTS[key] || [key, ''];
    const w_panel = 320, h_panel = 68;
    const x0 = W / 2 - w_panel / 2;
    const y0 = 130;
    this.rect(x0, y0, x0 + w_panel, y0 + h_panel, '#FFC107', '#FF8F00', 2);
    this.text('★ 成就解锁 ★', x0 + w_panel / 2, y0 + 20,
              'bold 13px "Courier New",monospace', '#4A2400', 'center');
    this.text(info[0], x0 + w_panel / 2, y0 + 42,
              'bold 15px "Courier New",monospace', '#4A2400', 'center');
    this.text(info[1], x0 + w_panel / 2, y0 + 60,
              '10px "Courier New",monospace', '#4A2400', 'center');
  }

  draw_ui(fg_hex) {
    const c = this.ctx;
    this.text('HI ' + String(this.best).padStart(5, '0') + '    ' +
              String(this.score).padStart(5, '0'),
              W - 24, 32, 'bold 17px "Courier New",monospace', fg_hex, 'right');
    this.text('● ' + this.stats.coins + '    ◆ ' + this.stats.gems,
              W - 24, 58, 'bold 12px "Courier New",monospace', fg_hex, 'right');
    this.text('♥'.repeat(Math.max(0, this.lives)), 20, 32,
              'bold 18px "Courier New",monospace', '#FF5252', 'left');
    this.text('角色: ' + DINO_CHARACTERS[this.dino_type].name, 20, 58,
              'bold 10px "Courier New",monospace', fg_hex, 'left');

    let x = 20;
    const y = 86;
    const active = [];
    if (this.shield_time > 0) active.push(['S', ITEM_COLORS.shield, this.shield_time]);
    if (this.magnet_time > 0) active.push(['M', ITEM_COLORS.magnet, this.magnet_time]);
    if (this.slow_time > 0) active.push(['T', ITEM_COLORS.slow, this.slow_time]);
    if (this.x2_time > 0) active.push(['X2', ITEM_COLORS.x2, this.x2_time]);
    if (this.rainbow_time > 0) active.push(['RB', '#E91E63', this.rainbow_time]);
    for (const a of active) {
      this.rect(x, y - 12, x + 36, y + 6, a[1]);
      this.text(a[0], x + 18, y - 3, 'bold 11px "Courier New",monospace', 'white', 'center');
      this.text(a[2].toFixed(1), x + 42, y - 3, 'bold 10px "Courier New",monospace', fg_hex, 'left');
      x += 82;
    }

    const ammo_y = 108;
    this.rect(20, ammo_y - 8, 70, ammo_y + 6, null, fg_hex, 1);
    if (this.ammo > 0) {
      this.rect(20, ammo_y - 8, 20 + 50 * (this.ammo / WEAPON_MAX_AMMO), ammo_y + 6, '#FFC107');
    }
    this.text('弹药 ' + this.ammo + '/' + WEAPON_MAX_AMMO + '  J/K', 78, ammo_y - 1,
              '10px "Courier New",monospace', fg_hex, 'left');

    const cd_ratio = DASH_COOLDOWN > 0 ? Math.max(0.0, 1.0 - this.dash_cooldown / DASH_COOLDOWN) : 1.0;
    const bar_y = 130;
    const bar_color = cd_ratio >= 1.0 ? '#4CAF50' : '#FFA726';
    this.rect(20, bar_y - 8, 70, bar_y + 6, null, fg_hex, 1);
    if (cd_ratio > 0) this.rect(20, bar_y - 8, 20 + 50 * cd_ratio, bar_y + 6, bar_color);
    this.text('冲刺 Shift/X', 78, bar_y - 1, '10px "Courier New",monospace', fg_hex, 'left');

    if (this.combo > 1) {
      let color = '#FF6F00';
      if (this.combo >= 10) color = '#E91E63';
      if (this.combo >= 20) color = '#9C27B0';
      this.text('连击 x' + this.combo, W / 2, 70,
                'bold 22px "Courier New",monospace', color, 'center');
    }
    if (this.perfect_flash > 0) {
      this.text('完美跳跃！+30', W / 2, 105,
                'bold 18px "Courier New",monospace', '#FFD700', 'center');
    }
    if (this.milestone_flash > 0) {
      this.text('里程碑！+2 生命  +100 分', W / 2, 135,
                'bold 20px "Courier New",monospace', '#FFD700', 'center');
    }
    if (this.coin_frenzy_time > 0) {
      this.text('✨ 金币狂热 ✨  ' + this.coin_frenzy_time.toFixed(1) + 's', W / 2, 160,
                'bold 18px "Courier New",monospace', '#FFC107', 'center');
    }

    if (this.state === 'ready') {
      this.text('小 恐 龙 大 冒 险', W / 2, 130,
                'bold 30px "Courier New",monospace', fg_hex, 'center');
      this.text('按 空格 开始游戏', W / 2, 168,
                '16px "Courier New",monospace', fg_hex, 'center');
      this.text('选择角色（按 1/2/3）', W / 2, 205,
                '12px "Courier New",monospace', fg_hex, 'center');
      for (let i = 0; i < DINO_CHARACTERS.length; i++) {
        const ch = DINO_CHARACTERS[i];
        const cx = W / 2 + (i - 1) * 130;
        const cy = 235;
        const sel = i === this.dino_type;
        this.rect(cx - 55, cy - 20, cx + 55, cy + 20, null, sel ? '#FFC107' : fg_hex, sel ? 3 : 1);
        this.text((i + 1) + '.' + ch.name, cx, cy,
                  'bold 12px "Courier New",monospace', fg_hex, 'center');
      }
      this.text('空格/↑ 跳跃  ↓ 下蹲  Shift/X 冲刺  J/K 射击  P 暂停  R 重开',
                W / 2, 275, '11px "Courier New",monospace', fg_hex, 'center');
      this.text('弹跳板弹飞 · 移动平台会上下移动 · 小心头顶落石和地面弹刺 · 水面掉入会扣血',
                W / 2, 295, '11px "Courier New",monospace', fg_hex, 'center');
      this.text('完美跳跃触发子弹时间 · 彩虹币触发无敌加速 · 金币狂热进行中',
                W / 2, 313, '11px "Courier New",monospace', fg_hex, 'center');
    } else if (this.state === 'gameover') {
      this.text('G A M E   O V E R', W / 2, 90,
                'bold 30px "Courier New",monospace', fg_hex, 'center');
      this.text('得分 ' + this.score + '      最高 ' + this.best, W / 2, 138,
                'bold 18px "Courier New",monospace', fg_hex, 'center');
      this.text('金币 ' + this.stats.coins + '    宝石 ' + this.stats.gems +
                '    Boss ' + this.stats.bosses + '    小怪 ' + this.stats.minions,
                W / 2, 172, '13px "Courier New",monospace', fg_hex, 'center');
      this.text('按 空格 或 R 重新开始', W / 2, 205,
                '14px "Courier New",monospace', fg_hex, 'center');
    }

    this.draw_achievement_popup(fg_hex);
  }

  loop() {
    const now = performance.now() / 1000;
    let dt = now - this.last_time;
    this.last_time = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    if (!this.paused) this.update(dt);
    this.draw();
    requestAnimationFrame(this.loop);
  }
}

/* ================= 启动 ================= */
window.addEventListener('load', function () {
  const canvas = document.getElementById('game');
  const game = new DinoGame(canvas);
  window.__dinoGame = game;
});
</script>
