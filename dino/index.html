<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小恐龙升级版 · 弹跳板 + 移动平台 + 落石 + 地刺 + 水面 + 子弹时间</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;
            background:#1b1b1f;overflow:hidden;}
  canvas{display:block;position:absolute;left:0;top:0;
         width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="game" width="960" height="380"></canvas>
<script>
"use strict";

/* ================= 常量 ================= */
const W = 960, H = 380, GROUND_BASE = 300, DINO_X = 110;

const GRAVITY = 2600.0;
const JUMP_V = 850.0;
const BASE_SPEED = 380.0;
const MAX_SPEED = 1050.0;
const SPEED_ACCEL = 11.0;

const DAY_BG = [247, 247, 247], NIGHT_BG = [18, 20, 36];
const DAY_FG = [83, 83, 83], NIGHT_FG = [235, 235, 245];
const FG_SWITCH = 0.35;

const SHIELD_DUR = 6.0, MAGNET_DUR = 8.0, SLOW_DUR = 5.0, X2_DUR = 8.0, RAINBOW_DUR = 3.0;
const DASH_DUR = 0.35, DASH_COOLDOWN = 2.2, DASH_SPEED_MUL = 2.0;
const COMBO_TIMEOUT = 2.0;

const WEAPON_MAX_AMMO = 10, WEAPON_START_AMMO = 3, WEAPON_COOLDOWN = 0.32;
const WEAPON_RELOAD_TIME = 2.6, AMMO_PICKUP_AMOUNT = 3;
const BULLET_SPEED = 900.0, BULLET_VY = -120.0;

const PORTAL_COOLDOWN = 28.0, COIN_FRENZY_DUR = 5.0;

const DINO_CHARACTERS = [
  { name: '经典', speed_mul: 1.0,  jump_mul: 1.0,  color: null },
  { name: '疾风', speed_mul: 1.08, jump_mul: 0.95, color: '#4FC3F7' },
  { name: '跃龙', speed_mul: 0.95, jump_mul: 1.10, color: '#81C784' },
];

const ACHIEVEMENTS = {
  first_coin:      ['首枚金币',   '收集第一枚金币'],
  coin_hoarder:    ['金币囤积者', '单局收集 50 枚金币'],
  gem_collector:   ['宝石收藏家', '单局收集 10 颗宝石'],
  perfect_5:       ['完美主义',   '单局 5 次完美跳跃'],
  boss_slayer:     ['屠龙者',     '击败一次 Boss'],
  speed_demon:     ['速度恶魔',   '达到最大速度'],
  score_1000:      ['千分王',     '得分达到 1000'],
  no_damage_30:    ['铁壁',       '单局 30 秒不受伤'],
  survivor_120:    ['生存大师',   '单局存活 120 秒'],
  sharpshooter:    ['神枪手',     '用武器击碎 20 个目标'],
  rainbow_rider:   ['彩虹骑士',   '收集彩虹币'],
  matrix_dodge:    ['闪避大师',   '触发 3 次子弹时间'],
};

const ITEM_COLORS = { shield: '#4FC3F7', magnet: '#FF5252', slow: '#9C27B0', x2: '#FFC107' };
const ITEM_SYMBOLS = { shield: 'S', magnet: 'M', slow: 'T', x2: 'X' };
const ITEM_TYPES = ['shield', 'magnet', 'slow', 'x2'];

const SOUND_FREQS = {
  jump: [650, 35], double_jump: [850, 35], coin: [1100, 25],
  gem: [1600, 60], item: [1300, 70], hurt: [220, 120],
  dash: [900, 35], boss_hit: [450, 60], boss_die: [120, 300],
  boss_enter: [180, 250], milestone: [1500, 180],
  crate: [320, 70], perfect: [1700, 50], shoot: [1000, 20],
  minion_kill: [700, 40], portal: [1400, 100],
  achievement: [1800, 120],
  bounce: [1200, 60], rock_warn: [400, 100],
  rock_land: [200, 80], spike_up: [500, 40],
  splash: [300, 90], rainbow: [2000, 100],
  bullet_time: [2800, 60],
};

/* ================= 工具函数 ================= */
function terrain_h(wx) {
  return 26.0 * Math.sin(wx * 0.0028)
       + 13.0 * Math.sin(wx * 0.0082 + 1.7)
       + 5.0 * Math.sin(wx * 0.0195 + 0.4);
}
function mix(c1, c2, t) {
  return [Math.round(c1[0] + (c2[0] - c1[0]) * t),
          Math.round(c1[1] + (c2[1] - c1[1]) * t),
          Math.round(c1[2] + (c2[2] - c1[2]) * t)];
}
function hx(c) {
  const r = Math.max(0, Math.min(255, c[0] | 0));
  const g = Math.max(0, Math.min(255, c[1] | 0));
  const b = Math.max(0, Math.min(255, c[2] | 0));
  return '#' + r.toString(16).padStart(2, '0')
             + g.toString(16).padStart(2, '0')
             + b.toString(16).padStart(2, '0');
}
function unhx(s) {
  s = s.replace('#', '');
  return [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)];
}
function prand(x, seed) {
  const v = Math.sin(x * 12.9898 + seed * 78.233) * 43758.5453;
  return v - Math.floor(v);
}
function rects_hit(a, b) {
  return !(a[2] <= b[0] || b[2] <= a[0] || a[3] <= b[1] || b[3] <= a[1]);
}
function point_in_rect(px, py, r, pad) {
  pad = pad || 0;
  return (r[0] - pad <= px && px <= r[2] + pad) && (r[1] - pad <= py && py <= r[3] + pad);
}
function rand(a, b) { return a + Math.random() * (b - a); }
function choice(a) { return a[Math.floor(Math.random() * a.length)]; }
function randint(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function weightedChoice(kinds, weights) {
  let total = 0;
  for (const w of weights) total += w;
  let r = Math.random() * total;
  for (let i = 0; i < kinds.length; i++) {
    r -= weights[i];
    if (r <= 0) return kinds[i];
  }
  return kinds[kinds.length - 1];
}

/* ================= 音效 ================= */
let audioCtx = null;
const soundLast = {};
function playSound(kind) {
  const f = SOUND_FREQS[kind];
  if (!f) return;
  const now = performance.now() / 1000;
  if (now - (soundLast[kind] || 0) < 0.04) return;
  soundLast[kind] = now;
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const freq = f[0], dur = f[1] / 1000;
  if (freq <= 0) return;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.045, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}

/* ================= 障碍物工厂 ================= */
function make_obstacle(kind, wx) {
  const base = { type: kind, wx: wx, vx: 0.0 };
  switch (kind) {
    case 'cactus_s': return Object.assign(base, { w: 26, h: 44 });
    case 'cactus_b': return Object.assign(base, { w: 38, h: 66 });
    case 'cactus_c': return Object.assign(base, { w: 62, h: 54, n: choice([2, 3]) });
    case 'spike':    return Object.assign(base, { w: 46, h: 28 });
    case 'bird':     return Object.assign(base, { w: 56, h: 34, air: choice([50, 75]) });
    case 'rock':     return Object.assign(base, { w: 42, h: 34 });
    case 'boulder':  return Object.assign(base, { w: 54, h: 54, vx: 95.0 });
    case 'pillar':   return Object.assign(base, { w: 30, h: 96 });
    case 'pendulum': return Object.assign(base, { w: 36, h: 160, anchor_h: 220.0, phase: rand(0, Math.PI * 2) });
    case 'jumper':   return Object.assign(base, { w: 44, h: 38, phase: rand(0, Math.PI * 2) });
    case 'saw':      return Object.assign(base, { w: 46, h: 46, phase: rand(0, Math.PI * 2), range: choice([60, 80, 100]) });
    case 'crate':    return Object.assign(base, { w: 46, h: 46 });
    default:         return Object.assign(base, { w: 26, h: 44 });
  }
}

/* ================= 游戏主体 ================= */
class DinoGame {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.load_save();
    this.init_world();
    this.dino_type = 0;
    this.reset();
    this.bind_keys();
    this.last_time = performance.now() / 1000;
    this.loop = this.loop.bind(this);
    requestAnimationFrame(this.loop);
  }

  /* ---------- 自适应画布 ---------- */
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = window.innerWidth;
    const ch = window.innerHeight;

    this.canvas.width  = Math.max(1, Math.round(cw * dpr));
    this.canvas.height = Math.max(1, Math.round(ch * dpr));
    this.canvas.style.width  = cw + 'px';
    this.canvas.style.height = ch + 'px';

    this.dpr = dpr;
    // contain：等比缩放、完整可见（四周可能留边，已用背景色填充）
    this.scale = Math.min(cw / W, ch / H);
    // 若要「填满屏幕、允许裁掉边缘」，把上一行换成：
    // this.scale = Math.max(cw / W, ch / H);

    this.offset_x = (cw - W * this.scale) / 2;
    this.offset_y = (ch - H * this.scale) / 2;
  }

  /* ---------- 存档 ---------- */
  load_save() {
    this.best = 0;
    this.unlocked_achievements = new Set();
    this.total_coins = 0;
    try {
      const raw = localStorage.getItem('dino_save');
      if (raw) {
        const data = JSON.parse(raw);
        this.best = data.best || 0;
        this.unlocked_achievements = new Set(data.achievements || []);
        this.total_coins = data.total_coins || 0;
      }
    } catch (e) { /* ignore */ }
  }
  save_progress() {
    try {
      localStorage.setItem('dino_save', JSON.stringify({
        best: this.best,
        achievements: Array.from(this.unlocked_achievements).sort(),
        total_coins: this.total_coins,
      }));
    } catch (e) { /* ignore */ }
  }

  init_world() {
    this.clouds = [];
    for (let i = 0; i < 4; i++) {
      this.clouds.push({
        x: rand(0, W), y: rand(24, 130),
        s: rand(0.7, 1.3), v: rand(12, 30),
      });
    }
    this.stars = [];
    for (let i = 0; i < 85; i++) {
      this.stars.push([rand(0, W), rand(10, 235), choice([1, 1, 2])]);
    }
  }

  reset() {
    this.state = 'ready';
    this.paused = false;
    this.distance = 0.0;
    this.elapsed = 0.0;
    this.speed = BASE_SPEED;
    this.score = 0;
    this.bonus = 0;

    this.dino_y = GROUND_BASE - terrain_h(DINO_X + 20);
    this.dino_vy = 0.0;
    this.on_ground = true;
    this.jump_count = 0;
    this.duck_wanted = false;
    this.ducking = false;

    this.obstacles = [];
    this.coins = [];
    this.gems = [];
    this.items = [];
    this.particles = [];
    this.pits = [];
    this.waters = [];
    this.platforms = [];
    this.bounce_pads = [];
    this.falling_rocks = [];
    this.ground_spikes = [];
    this.rainbow_coins = [];

    this.bullets = [];
    this.minions = [];
    this.portals = [];
    this.ammo_pickups = [];
    this.ammo = WEAPON_START_AMMO;
    this.weapon_cooldown = 0.0;
    this.weapon_reload = 0.0;
    this.weapon_kills = 0;
    this.coin_frenzy_time = 0.0;
    this.portal_timer = PORTAL_COOLDOWN;
    this.last_hurt_time = 0.0;

    this.bullet_time = 0.0;
    this.time_scale = 1.0;
    this.bullet_time_count = 0;
    this.rainbow_time = 0.0;
    this.water_acc = 0.0;
    this.next_water = 2200.0;
    this.bounce_acc = 0.0;
    this.next_bounce = 900.0;
    this.trap_acc = 0.0;
    this.next_trap = 1400.0;
    this.rainbow_timer = rand(14.0, 20.0);

    this.lives = 5;
    this.max_lives = 7;
    this.invincible = 0.0;

    this.next_milestone = 500;
    this.milestone_flash = 0.0;
    this.perfect_flash = 0.0;
    this.perfect_count = 0;

    this.stats = { coins: 0, gems: 0, bosses: 0, minions: 0 };

    this.boss = null;
    this.boss_bombs = [];
    this.boss_next_time = 65.0;

    this.spawn_acc = 0.0;
    this.next_spawn = 650.0;
    this.coin_timer = 3.0;
    this.gem_timer = 6.0;
    this.pit_acc = 0.0;
    this.next_pit = 1800.0;
    this.platform_acc = 0.0;
    this.next_platform = 900.0;
    this.item_timer = rand(4.0, 7.0);
    this.ammo_timer = rand(6.0, 10.0);

    this.shield_time = 0.0;
    this.magnet_time = 0.0;
    this.slow_time = 0.0;
    this.x2_time = 0.0;

    this.dash_time = 0.0;
    this.dash_cooldown = 0.0;

    this.combo = 0;
    this.combo_timer = 0.0;

    this.shake_time = 0.0;
    this.shake_dur = 0.0;
    this.shake_mag = 0.0;

    this.weather = { type: 'clear', timer: rand(15, 25), drops: [], flakes: [] };

    this.achievement_queue = [];
    this.achievement_current = null;
    this.achievement_timer = 0.0;

    this.night = 0.0;
    this.frame = 0;
    this.jump_held = false;
  }

  /* ---------- 地形查询 ---------- */
  in_pit(wx) {
    for (const p of this.pits) if (p[0] <= wx && wx <= p[1]) return true;
    return false;
  }
  in_water(wx) {
    for (const p of this.waters) if (p[0] <= wx && wx <= p[1]) return true;
    return false;
  }
  is_hole(wx) { return this.in_pit(wx) || this.in_water(wx); }

  shake(mag, dur) {
    this.shake_mag = Math.max(this.shake_mag, mag);
    this.shake_dur = Math.max(this.shake_dur, dur);
    this.shake_time = Math.max(this.shake_time, dur);
  }

  char_mul() {
    const c = DINO_CHARACTERS[this.dino_type];
    return [c.speed_mul, c.jump_mul];
  }

  get_colors() {
    const n = this.night;
    const bg = mix(DAY_BG, NIGHT_BG, n);
    const fg = n < FG_SWITCH ? DAY_FG : NIGHT_FG;
    return {
      bg: bg, bg_hex: hx(bg), fg_hex: hx(fg),
      ground_hex: hx(mix(bg, fg, 0.18)),
      dark_hex: hx(mix(bg, fg, 0.35)),
      cloud_hex: hx(mix(bg, fg, 0.22)),
    };
  }

  /* ---------- 成就 ---------- */
  unlock_achievement(key) {
    if (this.unlocked_achievements.has(key)) return;
    this.unlocked_achievements.add(key);
    this.achievement_queue.push(key);
    playSound('achievement');
    this.save_progress();
  }
  update_achievement_notify(dt) {
    if (this.achievement_current === null) {
      if (this.achievement_queue.length) {
        this.achievement_current = this.achievement_queue.shift();
        this.achievement_timer = 3.0;
      }
    } else {
      this.achievement_timer -= dt;
      if (this.achievement_timer <= 0) this.achievement_current = null;
    }
  }
  check_achievements() {
    const s = this.stats;
    if (s.coins >= 1) this.unlock_achievement('first_coin');
    if (s.coins >= 50) this.unlock_achievement('coin_hoarder');
    if (s.gems >= 10) this.unlock_achievement('gem_collector');
    if (this.perfect_count >= 5) this.unlock_achievement('perfect_5');
    if (s.bosses >= 1) this.unlock_achievement('boss_slayer');
    if (this.speed >= MAX_SPEED * 0.98) this.unlock_achievement('speed_demon');
    if (this.score >= 1000) this.unlock_achievement('score_1000');
    if ((this.elapsed - this.last_hurt_time) >= 30 && this.lives === this.max_lives)
      this.unlock_achievement('no_damage_30');
    if (this.elapsed >= 120) this.unlock_achievement('survivor_120');
    if (this.weapon_kills >= 20) this.unlock_achievement('sharpshooter');
    if (this.rainbow_time > 0 || this.stats.rainbow_used) this.unlock_achievement('rainbow_rider');
    if (this.bullet_time_count >= 3) this.unlock_achievement('matrix_dodge');
  }

  /* ---------- 输入 ---------- */
  bind_keys() {
    window.addEventListener('keydown', (e) => {
      const k = e.key;
      if (k === ' ' || k === 'ArrowUp' || k === 'ArrowDown' ||
          k === 'ArrowLeft' || k === 'ArrowRight') e.preventDefault();

      if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') this.on_jump();
      else if (k === 'ArrowDown' || k === 's' || k === 'S') this.on_duck();
      else if (k === 'Shift' || k === 'x' || k === 'X') this.on_dash();
      else if (k === 'j' || k === 'J' || k === 'k' || k === 'K') this.on_fire();
      else if (k === 'p' || k === 'P') this.on_pause();
      else if (k === 'r' || k === 'R') this.on_restart();
      else if (k === '1') this.select_char(0);
      else if (k === '2') this.select_char(1);
      else if (k === '3') this.select_char(2);
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key;
      if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') this.jump_held = false;
      else if (k === 'ArrowDown' || k === 's' || k === 'S') this.duck_wanted = false;
    });
    this.canvas.addEventListener('mousedown', () => { if (!this.paused) this.do_jump(); });
  }

  select_char(idx) { if (this.state === 'ready') this.dino_type = idx; }

  on_jump() {
    if (this.paused || this.jump_held) return;
    this.jump_held = true;
    this.do_jump();
  }
  on_duck() { if (!this.paused) this.duck_wanted = true; }
  on_dash() { if (!this.paused) this.do_dash(); }
  on_fire() { if (!this.paused) this.do_fire(); }
  on_pause() { if (this.state === 'playing') this.paused = !this.paused; }
  on_restart() {
    if (this.state === 'gameover') { this.reset(); this.state = 'playing'; }
  }

  do_jump() {
    if (this.state === 'ready') { this.state = 'playing'; return; }
    if (this.state === 'gameover') { this.reset(); this.state = 'playing'; return; }
    const jm = this.char_mul()[1];
    if (this.on_ground) {
      this.dino_vy = -JUMP_V * jm;
      this.on_ground = false;
      this.jump_count = 1;
      this.duck_wanted = false;
      this.spawn_particles(DINO_X + 25, this.dino_y, 6, ['#cccccc', '#eeeeee'], 120, 0.4);
      playSound('jump');
    } else if (this.jump_count < 2) {
      this.dino_vy = -JUMP_V * 0.88 * jm;
      this.jump_count = 2;
      this.spawn_particles(DINO_X + 25, this.dino_y - 20, 8, ['#cccccc', '#eeeeee'], 150, 0.4);
      playSound('double_jump');
    }
  }

  do_dash() {
    if (this.state !== 'playing' || this.dash_cooldown > 0 || this.dash_time > 0) return;
    this.dash_time = DASH_DUR;
    this.dash_cooldown = DASH_COOLDOWN;
    this.spawn_particles(DINO_X + 25, this.dino_y - 25, 10, ['#00E5FF', '#ffffff'], 220, 0.4);
    playSound('dash');
  }

  do_fire() {
    if (this.state !== 'playing' || this.weapon_cooldown > 0 || this.ammo <= 0) return;
    this.ammo -= 1;
    this.weapon_cooldown = WEAPON_COOLDOWN;
    const sy = this.ducking ? (this.dino_y - 20) : (this.dino_y - 40);
    this.bullets.push({ sx: DINO_X + 50, sy: sy });
    this.spawn_particles(DINO_X + 55, sy, 4, ['#FFC107', '#FF7043'], 120, 0.2);
    playSound('shoot');
  }

  spawn_particles(x, y, count, colors, speed, life, gravity) {
    speed = speed === undefined ? 150 : speed;
    life = life === undefined ? 0.6 : life;
    gravity = gravity === undefined ? 600 : gravity;
    if (this.particles.length > 180) return;
    for (let i = 0; i < count; i++) {
      const a = rand(0, Math.PI * 2);
      const s = rand(0.3, 1.0) * speed;
      const lf = rand(0.5, 1.0) * life;
      this.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - rand(0, speed * 0.5),
        life: lf, max_life: lf,
        color: choice(colors),
        size: randint(2, 4),
        gravity: gravity,
      });
    }
  }

  /* ---------- 物理辅助 ---------- */
  foot_wx() { return this.distance + DINO_X + 20; }
  platform_span(p) { return [p.wx - p.w / 2, p.wx + p.w / 2]; }
  platform_contains(p) {
    const sp = this.platform_span(p);
    const wx = this.foot_wx();
    return sp[0] - 6 <= wx && wx <= sp[1] + 6;
  }
  find_stand_support() {
    const wx = this.foot_wx();
    let best = null;
    if (!this.is_hole(wx)) {
      const gy = GROUND_BASE - terrain_h(wx);
      if (Math.abs(gy - this.dino_y) < 10) best = gy;
    }
    for (const p of this.platforms) {
      if (this.platform_contains(p)) {
        if (Math.abs(p.y - this.dino_y) < 10) {
          if (best === null || p.y < best) best = p.y;
        }
      }
    }
    return best;
  }
  find_landing(prev_y, cur_y) {
    const wx = this.foot_wx();
    let best = null;
    if (!this.is_hole(wx)) {
      const gy = GROUND_BASE - terrain_h(wx);
      if (prev_y - 2 <= gy && gy <= cur_y + 2) best = gy;
    }
    for (const p of this.platforms) {
      if (this.platform_contains(p)) {
        if (prev_y - 2 <= p.y && p.y <= cur_y + 2) {
          if (best === null || p.y < best) best = p.y;
        }
      }
    }
    return best;
  }
  pendulum_pos(ob) {
    const ax_sx = ob.wx - this.distance;
    const ay = GROUND_BASE - terrain_h(ob.wx) - ob.anchor_h;
    const ang = Math.sin(this.elapsed * 2.0 + ob.phase) * 0.85;
    const L = ob.h;
    return [ax_sx, ay, ax_sx + Math.sin(ang) * L, ay + Math.cos(ang) * L];
  }
  jumper_y(ob) {
    const gy = GROUND_BASE - terrain_h(ob.wx);
    return gy - Math.abs(Math.sin(this.elapsed * 3.2 + ob.phase)) * 55.0;
  }
  saw_x(ob) {
    return (ob.wx - this.distance) + Math.sin(this.elapsed * 2.8 + ob.phase) * ob.range;
  }

  /* ---------- 生成 ---------- */
  is_boss_active() {
    return this.boss !== null &&
      (this.boss.state === 'entering' || this.boss.state === 'active' || this.boss.state === 'dying');
  }

  spawn_obstacle() {
    let rightmost = -1e9;
    for (const o of this.obstacles) rightmost = Math.max(rightmost, o.wx + o.w);
    const wx = this.distance + W + rand(70, 150);
    if (rightmost > wx - 150) return;
    if (this.is_hole(wx) || this.is_hole(wx + 60) || this.is_hole(wx - 30)) return;

    const t = this.elapsed;
    const pool = [['cactus_s', 30], ['cactus_b', 24], ['cactus_c', 18]];
    if (t > 8)  pool.push(['spike', 20]);
    if (t > 15) pool.push(['bird', 26]);
    if (t > 22) pool.push(['rock', 18]);
    if (t > 25) pool.push(['crate', 18]);
    if (t > 28) pool.push(['jumper', 20]);
    if (t > 32) pool.push(['boulder', 14]);
    if (t > 38) pool.push(['pendulum', 16]);
    if (t > 45) pool.push(['pillar', 14]);
    if (t > 52) pool.push(['saw', 18]);

    const kinds = pool.map(p => p[0]);
    const weights = pool.map(p => p[1]);
    const kind = weightedChoice(kinds, weights);

    if (kind === 'pendulum' || kind === 'saw' || kind === 'jumper') {
      for (const p of this.platforms) {
        if (Math.abs(p.wx - wx) < (p.w / 2 + 100)) return;
      }
    }
    for (const p of this.platforms) {
      if (Math.abs(p.wx - wx) < (p.w / 2 + 55)) {
        const ob_top = GROUND_BASE - terrain_h(wx) - 96;
        if (ob_top < p.y + 18) return;
      }
    }
    this.obstacles.push(make_obstacle(kind, wx));
  }

  spawn_coins() {
    if (this.coin_frenzy_time > 0) {
      const base = this.distance + W + 60;
      for (let i = 0; i < 8; i++) {
        const wx = base + i * 40;
        if (this.is_hole(wx)) continue;
        const gy = GROUND_BASE - terrain_h(wx);
        this.coins.push({ wx: wx, y: gy - rand(40, 140) });
      }
      return;
    }
    if (this.platforms.length && Math.random() < 0.6) {
      const p = choice(this.platforms);
      const n = Math.max(3, Math.floor(p.w / 40));
      for (let i = 0; i < n; i++) {
        const offset = (i - (n - 1) / 2) * 38;
        this.coins.push({ wx: p.wx + offset, y: p.y - 32 });
      }
      return;
    }
    const base = this.distance + W + 90;
    const n = randint(2, 4);
    const air = choice([58, 92, 128]);
    for (let i = 0; i < n; i++) {
      const wx = base + i * 36;
      if (this.is_hole(wx)) continue;
      const gy = GROUND_BASE - terrain_h(wx);
      this.coins.push({ wx: wx, y: gy - air });
    }
  }

  spawn_gem() {
    if (this.platforms.length && Math.random() < 0.6) {
      const p = choice(this.platforms);
      this.gems.push({ wx: p.wx + rand(-p.w / 3, p.w / 3), y: p.y - 50 });
    } else {
      const wx = this.distance + W + rand(200, 450);
      if (this.is_hole(wx)) return;
      const gy = GROUND_BASE - terrain_h(wx);
      this.gems.push({ wx: wx, y: gy - rand(90, 160) });
    }
  }

  spawn_item() {
    let wx, y;
    if (this.platforms.length && Math.random() < 0.4) {
      const p = choice(this.platforms);
      wx = p.wx + rand(-p.w / 2 + 25, p.w / 2 - 25);
      y = p.y - 42;
    } else {
      wx = this.distance + W + rand(150, 330);
      if (this.is_hole(wx)) return;
      const gy = GROUND_BASE - terrain_h(wx);
      y = gy - rand(70, 140);
    }
    this.items.push({ type: choice(ITEM_TYPES), wx: wx, y: y, phase: rand(0, 6.28) });
  }

  spawn_ammo_pickup() {
    const wx = this.distance + W + rand(150, 400);
    if (this.is_hole(wx)) return;
    const gy = GROUND_BASE - terrain_h(wx);
    this.ammo_pickups.push({ wx: wx, y: gy - rand(60, 150), phase: rand(0, 6.28) });
  }

  spawn_minion() {
    const wx = this.distance + W + rand(60, 180);
    const gy = GROUND_BASE - terrain_h(wx);
    this.minions.push({
      sx: W + 60, wx: wx, sy: gy - rand(80, 200),
      dive: false, phase: rand(0, 6.28),
    });
  }

  spawn_portal() {
    if (this.portals.length) return;
    const wx = this.distance + W + rand(200, 400);
    if (this.is_hole(wx)) return;
    const gy = GROUND_BASE - terrain_h(wx);
    this.portals.push({ wx: wx, y: gy - rand(80, 140), phase: rand(0, 6.28) });
  }

  spawn_pit() {
    let wx_start;
    if (this.pits.length) {
      let last_end = -1e9;
      for (const p of this.pits) last_end = Math.max(last_end, p[1]);
      wx_start = Math.max(last_end + rand(320, 560), this.distance + W + 180);
    } else {
      wx_start = this.distance + W + rand(220, 380);
    }
    const pit_w = rand(100, 185);
    const wx_end = wx_start + pit_w;
    this.pits.push([wx_start, wx_end]);
    this.obstacles = this.obstacles.filter(o => !(wx_start - 60 < o.wx && o.wx < wx_end + 60));
    this.platforms = this.platforms.filter(p => !(wx_start - 130 < p.wx && p.wx < wx_end + 130));
    if (Math.random() < 0.75) {
      const px = (wx_start + wx_end) / 2 + rand(-20, 20);
      const py = GROUND_BASE - rand(105, 145);
      const pw = rand(140, 220);
      this.platforms.push({ wx: px, w: pw, y: py });
    }
    if (pit_w > 140 && Math.random() < 0.55) {
      const px = wx_end + rand(20, 70);
      const py = GROUND_BASE - rand(85, 125);
      const pw = rand(120, 190);
      this.platforms.push({ wx: px, w: pw, y: py });
    }
  }

  spawn_water() {
    let wx_start;
    if (this.waters.length) {
      let last_end = -1e9;
      for (const p of this.waters) last_end = Math.max(last_end, p[1]);
      wx_start = Math.max(last_end + rand(400, 700), this.distance + W + 250);
    } else {
      wx_start = this.distance + W + rand(300, 500);
    }
    const w = rand(120, 200);
    const wx_end = wx_start + w;
    this.waters.push([wx_start, wx_end]);
    this.obstacles = this.obstacles.filter(o => !(wx_start - 80 < o.wx && o.wx < wx_end + 80));
    this.platforms = this.platforms.filter(p => !(wx_start - 130 < p.wx && p.wx < wx_end + 130));
    if (Math.random() < 0.7) {
      const px = (wx_start + wx_end) / 2 + rand(-20, 20);
      const py = GROUND_BASE - rand(110, 150);
      const pw = rand(110, 170);
      this.platforms.push({ wx: px, w: pw, y: py });
    }
  }

  spawn_platform() {
    const wx = this.distance + W + rand(160, 340);
    const w = rand(140, 260);
    for (const seg of this.pits.concat(this.waters)) {
      if (seg[1] > wx - (w / 2 + 40) && seg[0] < wx + (w / 2 + 40)) return;
    }
    for (const p of this.platforms) {
      if (Math.abs(p.wx - wx) < (p.w + w + 60) / 2) return;
    }
    const stand_y = GROUND_BASE - rand(118, 168);
    for (const ob of this.obstacles) {
      if (Math.abs(ob.wx - wx) < 100) {
        const gy = GROUND_BASE - terrain_h(ob.wx);
        if (gy - ob.h < stand_y + 22) return;
      }
    }
    if (Math.random() < 0.35) {
      this.platforms.push({
        wx: wx, w: w, y: stand_y,
        moving: true, base_y: stand_y,
        amp: rand(25, 45), speed: rand(1.0, 1.8), phase: rand(0, 6.28),
      });
    } else {
      this.platforms.push({ wx: wx, w: w, y: stand_y });
    }
    if (Math.random() < 0.45) {
      const wx2 = wx + w / 2 + rand(70, 120);
      const stand_y2 = GROUND_BASE - rand(110, 160);
      const w2 = rand(120, 200);
      this.platforms.push({ wx: wx2, w: w2, y: stand_y2 });
    }
  }

  spawn_bounce_pad() {
    const wx = this.distance + W + rand(150, 400);
    if (this.is_hole(wx) || this.is_hole(wx - 40) || this.is_hole(wx + 40)) return;
    for (const p of this.platforms) if (Math.abs(p.wx - wx) < 90) return;
    this.bounce_pads.push({ wx: wx, phase: rand(0, 6.28) });
  }

  spawn_falling_rock() {
    const wx = this.distance + W + rand(220, 450);
    if (this.is_hole(wx)) return;
    this.falling_rocks.push({
      wx: wx, state: 'warning', timer: 0.0,
      sx: null, sy: null, vy: 0.0,
      ground_y: GROUND_BASE - terrain_h(wx),
    });
  }

  spawn_ground_spike() {
    const wx = this.distance + W + rand(220, 450);
    if (this.is_hole(wx)) return;
    this.ground_spikes.push({ wx: wx, state: 'idle', timer: 0.0, up: 0.0 });
  }

  spawn_rainbow_coin() {
    const wx = this.distance + W + rand(200, 500);
    if (this.is_hole(wx)) return;
    const gy = GROUND_BASE - terrain_h(wx);
    this.rainbow_coins.push({ wx: wx, y: gy - rand(100, 170), phase: rand(0, 6.28) });
  }

  /* ---------- Boss ---------- */
  spawn_boss() {
    this.boss = {
      state: 'entering', sx: W + 200, sy: 150,
      bob_t: 0.0, hp: 5, max_hp: 5, invuln: 0.0,
      throw_timer: 1.5, death_timer: 0.0,
    };
    playSound('boss_enter');
    this.shake(5, 0.5);
  }

  update_boss(dt) {
    if (this.boss === null) {
      if (this.elapsed >= this.boss_next_time) this.spawn_boss();
      return;
    }
    const b = this.boss;
    if (b.state === 'entering') {
      b.sx -= 380 * dt;
      if (b.sx <= W - 200) {
        b.sx = W - 200;
        b.state = 'active';
        b.throw_timer = 1.2;
      }
    } else if (b.state === 'active') {
      b.bob_t += dt;
      b.sy = 150 + Math.sin(b.bob_t * 2.5) * 30;
      b.throw_timer -= dt;
      if (b.throw_timer <= 0) {
        b.throw_timer = rand(1.3, 2.0);
        this.boss_bombs.push({
          sx: b.sx - 30, sy: b.sy + 35,
          vx: -160 + rand(-40, 40), vy: 30,
        });
      }
      if (b.invuln > 0) b.invuln = Math.max(0.0, b.invuln - dt);
    } else if (b.state === 'dying') {
      b.death_timer -= dt;
      if (Math.random() < 0.5) {
        this.spawn_particles(b.sx + rand(-60, 60), b.sy + rand(-40, 40),
                             4, ['#FF5252', '#FFC107', '#ffffff'], 200, 0.5);
      }
      if (b.death_timer <= 0) b.state = 'leaving';
    } else if (b.state === 'leaving') {
      b.sx += 380 * dt;
      b.sy -= 120 * dt;
      if (b.sx > W + 250) {
        this.boss = null;
        this.boss_next_time = this.elapsed + rand(55, 80);
      }
    }
    for (const bomb of this.boss_bombs) {
      bomb.sx += bomb.vx * dt;
      bomb.sy += bomb.vy * dt;
      bomb.vy += 1400 * dt;
    }
    this.boss_bombs = this.boss_bombs.filter(bm => bm.sy < H + 40 && bm.sx > -60);
  }

  boss_die() {
    const b = this.boss;
    b.state = 'dying';
    b.death_timer = 1.5;
    this.stats.bosses += 1;
    playSound('boss_die');
    this.shake(14, 0.6);
    for (let i = 0; i < 12; i++) {
      this.coins.push({
        wx: this.distance + b.sx + rand(-110, 110),
        y: b.sy + rand(-40, 40),
      });
    }
    for (let i = 0; i < 4; i++) {
      this.gems.push({
        wx: this.distance + b.sx + rand(-80, 80),
        y: b.sy + rand(-40, 40),
      });
    }
  }

  /* ---------- 伤害 ---------- */
  take_damage() {
    if (this.invincible > 0 || this.shield_time > 0 ||
        this.dash_time > 0 || this.rainbow_time > 0) return;
    this.lives -= 1;
    this.invincible = 1.5;
    this.last_hurt_time = this.elapsed;
    this.shake(12, 0.35);
    playSound('hurt');
    this.spawn_particles(DINO_X + 25, this.dino_y - 30, 20,
                         ['#FF5252', '#ffffff', '#FFC107'], 300, 0.7);
    if (this.lives <= 0) this.game_over();
  }

  game_over() {
    this.state = 'gameover';
    this.total_coins += this.stats.coins;
    if (this.score > this.best) this.best = this.score;
    this.save_progress();
  }

  break_crate(ob) {
    const sx = ob.wx - this.distance;
    const gy = GROUND_BASE - terrain_h(ob.wx);
    this.spawn_particles(sx, gy - ob.h / 2, 16,
                         ['#8D6E63', '#D7CCC8', '#FFC107'], 240, 0.6);
    playSound('crate');
    this.shake(4, 0.15);
    const r = Math.random();
    if (r < 0.5) {
      for (let i = 0; i < 2; i++) {
        this.coins.push({ wx: ob.wx + (i - 0.5) * 30, y: gy - 60 });
      }
    } else if (r < 0.85) {
      this.items.push({ type: choice(ITEM_TYPES), wx: ob.wx, y: gy - 70, phase: rand(0, 6.28) });
    } else {
      this.gems.push({ wx: ob.wx, y: gy - 80 });
    }
  }

  /* ---------- 碰撞盒 ---------- */
  dino_box() {
    const by = this.dino_y;
    if (this.ducking) return [DINO_X - 6, by - 30, DINO_X + 62, by - 2];
    return [DINO_X + 4, by - 52, DINO_X + 52, by - 2];
  }

  obstacle_box(ob) {
    const sx = ob.wx - this.distance;
    const gy = GROUND_BASE - terrain_h(ob.wx);
    const t = ob.type;
    if (t === 'bird') {
      const cy = gy - ob.air;
      return [sx - ob.w * 0.42, cy - ob.h * 0.42, sx + ob.w * 0.42, cy + ob.h * 0.42];
    }
    if (t === 'pendulum') {
      const pp = this.pendulum_pos(ob);
      const r = ob.w * 0.55;
      return [pp[2] - r, pp[3] - r, pp[2] + r, pp[3] + r];
    }
    if (t === 'jumper') {
      const cy = this.jumper_y(ob);
      return [sx - ob.w * 0.42, cy - ob.h, sx + ob.w * 0.42, cy];
    }
    if (t === 'saw') {
      const cx = this.saw_x(ob);
      const cy = gy - ob.h * 0.5 - 6;
      const r = ob.w * 0.5;
      return [cx - r, cy - r, cx + r, cy + r];
    }
    return [sx - ob.w * 0.42, gy - ob.h + 2, sx + ob.w * 0.42, gy];
  }

  bullet_hits_obstacle(b, ob) {
    const sx = ob.wx - this.distance;
    const gy = GROUND_BASE - terrain_h(ob.wx);
    const t = ob.type;
    const pad = 22;
    if (t === 'bird') {
      const cy = gy - ob.air;
      return Math.abs(b.sx - sx) < ob.w * 0.5 + pad && Math.abs(b.sy - cy) < ob.h * 0.5 + pad;
    }
    if (t === 'pendulum') {
      const pp = this.pendulum_pos(ob);
      const r = ob.w * 0.55;
      return Math.abs(b.sx - pp[2]) < r + pad && Math.abs(b.sy - pp[3]) < r + pad;
    }
    if (t === 'jumper') {
      const cy = this.jumper_y(ob);
      return Math.abs(b.sx - sx) < ob.w * 0.5 + pad && Math.abs(b.sy - cy) < ob.h + pad;
    }
    if (t === 'saw') {
      const cx = this.saw_x(ob);
      const cy = gy - ob.h * 0.5 - 6;
      const r = ob.w * 0.5;
      return Math.abs(b.sx - cx) < r + pad && Math.abs(b.sy - cy) < r + pad;
    }
    return Math.abs(b.sx - sx) < ob.w * 0.5 + pad &&
           gy - ob.h - pad < b.sy && b.sy < gy + pad;
  }

  apply_item(kind) {
    if (kind === 'shield') this.shield_time = SHIELD_DUR;
    else if (kind === 'magnet') this.magnet_time = MAGNET_DUR;
    else if (kind === 'slow') this.slow_time = SLOW_DUR;
    else if (kind === 'x2') this.x2_time = X2_DUR;
  }

  check_collisions() {
    const db = this.dino_box();
    const destroyed = [];

    for (const ob of this.obstacles) {
      if (!rects_hit(db, this.obstacle_box(ob))) continue;
      const ob_top = GROUND_BASE - terrain_h(ob.wx) - ob.h;
      if (ob.type === 'crate') {
        if (this.dash_time > 0 || (!this.on_ground && this.dino_vy > 0 && this.dino_y < ob_top + 20)) {
          destroyed.push(ob);
          this.break_crate(ob);
        } else {
          this.take_damage();
        }
      } else {
        if (this.dash_time > 0) {
          destroyed.push(ob);
          this.spawn_particles(ob.wx - this.distance, ob_top, 12,
                               ['#FFC107', '#ffffff'], 220, 0.5);
          this.shake(4, 0.15);
        } else if (this.shield_time > 0) {
          destroyed.push(ob);
          this.shield_time = 0.0;
          this.spawn_particles(ob.wx - this.distance, ob_top, 18,
                               ['#4FC3F7', '#ffffff'], 260, 0.6);
          this.shake(8, 0.25);
        } else {
          this.take_damage();
        }
      }
    }
    for (const ob of destroyed) {
      const idx = this.obstacles.indexOf(ob);
      if (idx >= 0) this.obstacles.splice(idx, 1);
    }

    for (let i = this.minions.length - 1; i >= 0; i--) {
      const m = this.minions[i];
      if (rects_hit(db, [m.sx - 22, m.sy - 22, m.sx + 22, m.sy + 22])) {
        if (this.dash_time > 0) {
          this.stats.minions += 1;
          this.bonus += 60;
          this.minions.splice(i, 1);
          this.spawn_particles(m.sx, m.sy, 14, ['#FF5252', '#FFC107'], 260, 0.5);
        } else {
          this.take_damage();
          this.minions.splice(i, 1);
          this.spawn_particles(m.sx, m.sy, 12, ['#FF5252', '#ffffff'], 220, 0.5);
        }
      }
    }

    for (let i = this.boss_bombs.length - 1; i >= 0; i--) {
      const bm = this.boss_bombs[i];
      const r = 14;
      if (rects_hit(db, [bm.sx - r, bm.sy - r, bm.sx + r, bm.sy + r])) {
        this.take_damage();
        this.spawn_particles(bm.sx, bm.sy, 14,
                             ['#FF5252', '#FFC107', '#ffffff'], 280, 0.6);
        this.boss_bombs.splice(i, 1);
      }
    }

    if (this.boss && this.boss.state === 'active' && this.boss.invuln <= 0) {
      const b = this.boss;
      if (rects_hit(db, [b.sx - 75, b.sy - 45, b.sx + 75, b.sy + 45])) {
        b.hp -= 1;
        b.invuln = 0.8;
        playSound('boss_hit');
        this.spawn_particles(b.sx, b.sy, 18,
                             ['#FF5252', '#FFC107', '#ffffff'], 300, 0.7);
        this.shake(6, 0.2);
        this.dino_vy = -JUMP_V * 0.65;
        this.on_ground = false;
        this.jump_count = 1;
        if (b.hp <= 0) this.boss_die();
      }
    }

    for (let i = this.portals.length - 1; i >= 0; i--) {
      const p = this.portals[i];
      const sx = p.wx - this.distance;
      const y = p.y + Math.sin(this.frame * 0.08 + p.phase) * 6;
      if (point_in_rect(sx, y, db, 20)) {
        this.portals.splice(i, 1);
        this.coin_frenzy_time = COIN_FRENZY_DUR;
        playSound('portal');
        this.spawn_particles(sx, y, 20, ['#9C27B0', '#E1BEE7', '#FFC107'], 280, 0.8);
        this.shake(5, 0.25);
      }
    }

    for (let i = this.ammo_pickups.length - 1; i >= 0; i--) {
      const ap = this.ammo_pickups[i];
      const sx = ap.wx - this.distance;
      const y = ap.y + Math.sin(this.frame * 0.1 + ap.phase) * 5;
      if (point_in_rect(sx, y, db, 16)) {
        this.ammo = Math.min(WEAPON_MAX_AMMO, this.ammo + AMMO_PICKUP_AMOUNT);
        this.ammo_pickups.splice(i, 1);
        this.spawn_particles(sx, y, 10, ['#FFC107', '#FFE9A0'], 180, 0.4);
      }
    }

    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      const sx = it.wx - this.distance;
      const y = it.y + Math.sin(this.frame * 0.1 + it.phase) * 5;
      if (point_in_rect(sx, y, db, 16)) {
        this.apply_item(it.type);
        this.spawn_particles(sx, y, 14, [ITEM_COLORS[it.type], '#ffffff'], 210, 0.6);
        playSound('item');
        this.items.splice(i, 1);
      }
    }

    for (let i = this.gems.length - 1; i >= 0; i--) {
      const g = this.gems[i];
      const sx = g.wx - this.distance;
      if (point_in_rect(sx, g.y, db, 14)) {
        this.gems.splice(i, 1);
        this.stats.gems += 1;
        const value = 100 * (this.x2_time > 0 ? 2 : 1);
        this.bonus += value;
        playSound('gem');
        this.spawn_particles(sx, g.y, 12, ['#BA68C8', '#E1BEE7', '#ffffff'], 220, 0.6);
      }
    }

    for (let i = this.rainbow_coins.length - 1; i >= 0; i--) {
      const rc = this.rainbow_coins[i];
      const sx = rc.wx - this.distance;
      const y = rc.y + Math.sin(this.frame * 0.12 + rc.phase) * 8;
      if (point_in_rect(sx, y, db, 18)) {
        this.rainbow_coins.splice(i, 1);
        this.rainbow_time = RAINBOW_DUR;
        this.stats.rainbow_used = true;
        this.bonus += 200;
        playSound('rainbow');
        this.spawn_particles(sx, y, 26,
                             ['#FF5252', '#FFC107', '#4FC3F7', '#81C784', '#E1BEE7'], 320, 1.0);
        this.shake(6, 0.3);
      }
    }

    for (let i = this.coins.length - 1; i >= 0; i--) {
      const c = this.coins[i];
      const sx = c.wx - this.distance;
      if (point_in_rect(sx, c.y, db, 13)) {
        this.coins.splice(i, 1);
        this.stats.coins += 1;
        this.combo += 1;
        this.combo_timer = COMBO_TIMEOUT;
        let value = 25;
        if (this.combo > 1) value = Math.floor(25 * (1 + Math.min(this.combo, 20) * 0.05));
        if (this.x2_time > 0) value *= 2;
        if (this.rainbow_time > 0) value *= 3;
        this.bonus += value;
        playSound('coin');
        this.spawn_particles(sx, c.y, 6, ['#FFC93C', '#FFE9A0'], 150, 0.4);
      }
    }
  }

  /* ---------- 新机制 ---------- */
  trigger_bullet_time() {
    if (this.bullet_time > 0) return;
    this.bullet_time = 0.45;
    this.bullet_time_count += 1;
    playSound('bullet_time');
  }

  check_perfect_jumps() {
    if (this.on_ground || this.dino_vy <= 0) return;
    for (const ob of this.obstacles) {
      if (ob.perfect_done || ob.type === 'bird') continue;
      const sx = ob.wx - this.distance;
      if (!(-25 <= sx - (DINO_X + 25) && sx - (DINO_X + 25) <= 25)) continue;
      const ob_top = GROUND_BASE - terrain_h(ob.wx) - ob.h;
      if (Math.abs(this.dino_y - ob_top) < 18) {
        ob.perfect_done = true;
        this.bonus += 30;
        this.perfect_flash = 0.6;
        this.perfect_count += 1;
        playSound('perfect');
        this.spawn_particles(sx, ob_top, 10, ['#FFD700', '#FFFFFF'], 170, 0.5);
        this.trigger_bullet_time();
      }
    }
  }

  check_bounce_pads() {
    const db = this.dino_box();
    for (const bp of this.bounce_pads.slice()) {
      const sx = bp.wx - this.distance;
      const gy = GROUND_BASE - terrain_h(bp.wx);
      const pad_box = [sx - 24, gy - 12, sx + 24, gy];
      if (rects_hit(db, pad_box) && this.dino_vy >= 0 && !this.on_ground) {
        const jm = this.char_mul()[1];
        this.dino_vy = -JUMP_V * 1.55 * jm;
        this.jump_count = 1;
        const idx = this.bounce_pads.indexOf(bp);
        if (idx >= 0) this.bounce_pads.splice(idx, 1);
        playSound('bounce');
        this.spawn_particles(sx, gy - 6, 14, ['#FFC107', '#FFE9A0'], 260, 0.5);
        this.shake(3, 0.15);
      }
    }
  }

  update_moving_platforms(dt) {
    for (const p of this.platforms) {
      if (p.moving) {
        p.y = p.base_y + Math.sin(this.elapsed * p.speed + p.phase) * p.amp;
      }
    }
  }

  update_falling_rocks(dt) {
    for (const r of this.falling_rocks) {
      const sx = r.wx - this.distance;
      if (r.state === 'warning') {
        if (-10 < sx && sx < W - 30) {
          r.timer += dt;
          if (r.timer > 1.0) {
            r.state = 'falling';
            r.sx = sx;
            r.sy = 0.0;
            r.vy = 0.0;
          }
        }
      } else if (r.state === 'falling') {
        r.sx = sx;
        r.vy += 2000 * dt;
        r.sy += r.vy * dt;
        if (r.sy >= r.ground_y - 28) {
          r.state = 'landed';
          r.timer = 0.0;
          r.sy = r.ground_y;
          this.spawn_particles(r.sx, r.ground_y - 20, 12,
                               ['#795548', '#A1887F', '#D7CCC8'], 220, 0.6);
          this.shake(4, 0.2);
        }
      } else if (r.state === 'landed') {
        r.timer += dt;
        if (r.timer > 0.8) r.state = 'gone';
      }
    }
    this.falling_rocks = this.falling_rocks.filter(r =>
      r.state !== 'gone' && r.wx > this.distance - 150);
  }

  update_ground_spikes(dt) {
    for (const sp of this.ground_spikes) {
      const sx = sp.wx - this.distance;
      if (sp.state === 'idle') {
        if (60 < sx && sx < W - 100) {
          sp.state = 'rising';
          sp.timer = 0.0;
          playSound('spike_up');
        }
      } else if (sp.state === 'rising') {
        sp.timer += dt;
        sp.up = Math.min(1.0, sp.timer / 0.15);
        if (sp.timer > 0.9) { sp.state = 'lowering'; sp.timer = 0.0; }
      } else if (sp.state === 'lowering') {
        sp.timer += dt;
        sp.up = Math.max(0.0, 1.0 - sp.timer / 0.2);
        if (sp.timer > 0.2) sp.state = 'done';
      }
    }
    this.ground_spikes = this.ground_spikes.filter(s =>
      s.state !== 'done' && s.wx > this.distance - 100);
  }

  check_rock_spike_collisions() {
    const db = this.dino_box();
    for (const r of this.falling_rocks) {
      if (r.state === 'warning') continue;
      const sx = r.sx !== null ? r.sx : (r.wx - this.distance);
      const sy = r.sy !== null ? r.sy : 0;
      let box;
      if (r.state === 'falling') box = [sx - 22, sy - 22, sx + 22, sy + 22];
      else box = [sx - 22, sy - 28, sx + 22, sy];
      if (rects_hit(db, box)) {
        if (this.dash_time > 0) {
          r.state = 'gone';
          this.spawn_particles(sx, sy - 15, 16, ['#795548', '#FFC107'], 260, 0.5);
          this.weapon_kills += 1;
        } else if (this.shield_time > 0) {
          r.state = 'gone';
          this.shield_time = 0.0;
          this.spawn_particles(sx, sy - 15, 18, ['#4FC3F7', '#ffffff'], 260, 0.6);
        } else {
          this.take_damage();
        }
      }
    }
    for (const sp of this.ground_spikes) {
      if (sp.up <= 0.05) continue;
      const sx = sp.wx - this.distance;
      const gy = GROUND_BASE - terrain_h(sp.wx);
      const spike_h = 34 * sp.up;
      const box = [sx - 22, gy - spike_h, sx + 22, gy];
      if (rects_hit(db, box)) {
        if (this.dash_time > 0) continue;
        if (this.shield_time > 0) {
          this.shield_time = 0.0;
          sp.state = 'lowering';
          sp.timer = 0.0;
          this.spawn_particles(sx, gy - 15, 18, ['#4FC3F7', '#ffffff'], 260, 0.6);
        } else {
          this.take_damage();
        }
      }
    }
  }

  handle_water_fall() {
    this.take_damage();
    if (this.state !== 'playing') return;
    const wx = this.foot_wx();
    const gy = GROUND_BASE - terrain_h(wx);
    this.dino_y = gy - 5;
    this.dino_vy = -JUMP_V * 0.55;
    this.on_ground = false;
    this.jump_count = 1;
    if (this.invincible < 1.0) this.invincible = 1.0;
    playSound('splash');
    this.spawn_particles(DINO_X + 25, this.dino_y + 20, 22,
                         ['#4FC3F7', '#81D4FA', '#ffffff'], 280, 0.7);
    this.shake(6, 0.3);
  }

  /* ---------- 武器 / 小怪 / 子弹 ---------- */
  update_bullets(dt) {
    for (const b of this.bullets) {
      b.sx += BULLET_SPEED * dt;
      b.sy += BULLET_VY * dt;
    }
    this.bullets = this.bullets.filter(b => b.sx < W + 30);

    for (const b of this.bullets.slice()) {
      let hit = false;
      for (const ob of this.obstacles.slice()) {
        if (this.bullet_hits_obstacle(b, ob)) {
          const idx = this.obstacles.indexOf(ob);
          if (idx >= 0) this.obstacles.splice(idx, 1);
          this.spawn_particles(b.sx, b.sy, 8, ['#FFC107', '#FF7043'], 180, 0.4);
          this.weapon_kills += 1;
          hit = true;
          break;
        }
      }
      if (hit) { const i = this.bullets.indexOf(b); if (i >= 0) this.bullets.splice(i, 1); continue; }

      for (const m of this.minions.slice()) {
        if (Math.abs(b.sx - m.sx) < 28 && Math.abs(b.sy - m.sy) < 28) {
          const i = this.minions.indexOf(m);
          if (i >= 0) this.minions.splice(i, 1);
          this.spawn_particles(m.sx, m.sy, 12, ['#FF5252', '#FFC107'], 220, 0.5);
          this.bonus += 50;
          this.weapon_kills += 1;
          this.stats.minions += 1;
          playSound('minion_kill');
          hit = true;
          break;
        }
      }
      if (hit) { const i = this.bullets.indexOf(b); if (i >= 0) this.bullets.splice(i, 1); continue; }

      if (this.boss && this.boss.state === 'active' && this.boss.invuln <= 0) {
        const bs = this.boss;
        if (Math.abs(b.sx - bs.sx) < 85 && Math.abs(b.sy - bs.sy) < 55) {
          bs.hp -= 1;
          bs.invuln = 0.8;
          playSound('boss_hit');
          this.spawn_particles(bs.sx, bs.sy, 14, ['#FF5252', '#FFC107'], 250, 0.6);
          this.shake(4, 0.15);
          if (bs.hp <= 0) this.boss_die();
          this.weapon_kills += 1;
          const i = this.bullets.indexOf(b);
          if (i >= 0) this.bullets.splice(i, 1);
        }
      }
    }
  }

  update_minions(dt) {
    for (const m of this.minions) {
      m.wx -= this.speed * dt;
      m.sx = m.wx - this.distance;
      if (m.sx < W * 0.7 && !m.dive) m.dive = true;
      if (m.dive) {
        const dx = (DINO_X + 25) - m.sx;
        const dy = (this.dino_y - 25) - m.sy;
        const d = Math.hypot(dx, dy) + 1;
        m.sx += dx / d * 420 * dt;
        m.sy += dy / d * 420 * dt;
        m.wx = m.sx + this.distance;
      } else {
        m.sy += Math.sin(this.elapsed * 4 + m.phase) * 30 * dt;
      }
    }
    this.minions = this.minions.filter(m => m.sx > -50 && m.sy < H + 30);
  }

  update_portals(dt) {
    for (const p of this.portals) p.wx -= this.speed * dt;
    this.portals = this.portals.filter(p => p.wx > this.distance - 100);
  }

  update_weather(dt) {
    const w = this.weather;
    w.timer -= dt;
    if (w.timer <= 0) {
      w.type = choice(['clear', 'clear', 'rain', 'snow', 'fog']);
      w.timer = rand(16, 28);
      w.drops = [];
      w.flakes = [];
    }
    if (w.type === 'rain') {
      for (let i = 0; i < 3; i++) {
        if (Math.random() < 0.75) {
          w.drops.push({
            x: rand(-50, W + 50), y: rand(-30, 0),
            vy: rand(750, 1050), vx: rand(-120, -60), len: rand(10, 18),
          });
        }
      }
      for (const d of w.drops) {
        d.x += d.vx * dt;
        d.y += d.vy * dt;
      }
      w.drops = w.drops.filter(d => d.y < H + 20 && d.x > -80);
      if (w.drops.length > 220) w.drops = w.drops.slice(-220);
    } else if (w.type === 'snow') {
      for (let i = 0; i < 2; i++) {
        if (Math.random() < 0.6) {
          w.flakes.push({
            x: rand(-30, W + 30), y: -10,
            vy: rand(60, 130), vx: rand(-30, 10),
            r: rand(1.5, 3.5), phase: rand(0, 6.28),
          });
        }
      }
      for (const f of w.flakes) {
        f.x += (f.vx + Math.sin(this.frame * 0.05 + f.phase) * 20) * dt;
        f.y += f.vy * dt;
      }
      w.flakes = w.flakes.filter(f => f.y < H + 20);
      if (w.flakes.length > 150) w.flakes = w.flakes.slice(-150);
    }
  }

  /* ---------- 主更新 ---------- */
  update(dtRaw) {
    this.frame++;

    if (this.bullet_time > 0) {
      this.bullet_time -= dtRaw;
      this.time_scale = 0.35;
    } else {
      this.time_scale = 1.0;
    }
    let dt = dtRaw * this.time_scale;

    const cloud_mul = this.state === 'playing' ? 1.6 : 1.0;
    for (const cl of this.clouds) {
      cl.x -= cl.v * dt * cloud_mul;
      if (cl.x < -150) {
        cl.x = W + rand(20, 260);
        cl.y = rand(24, 130);
        cl.s = rand(0.7, 1.3);
        cl.v = rand(12, 30);
      }
    }

    this.update_weather(dt);
    this.update_achievement_notify(dt);

    if (this.state !== 'playing') return;

    this.elapsed += dt;

    const mul_c = this.char_mul();
    const sm = mul_c[0], jm = mul_c[1];
    const base_speed = Math.min(MAX_SPEED, (BASE_SPEED + this.elapsed * SPEED_ACCEL) * sm);
    let mul = 1.0;
    if (this.dash_time > 0) mul *= DASH_SPEED_MUL;
    if (this.slow_time > 0) mul *= 0.6;
    if (this.rainbow_time > 0) mul *= 1.25;
    this.speed = base_speed * mul;

    this.distance += this.speed * dt;
    let base_score = Math.floor(this.distance / 10);
    if (this.x2_time > 0) base_score *= 2;
    if (this.rainbow_time > 0) base_score *= 3;
    this.score = base_score + this.bonus;
    if (this.score > this.best) this.best = this.score;

    this.night = 0.5 - 0.5 * Math.cos(this.elapsed / 7.0);

    const timedAttrs = ['shield_time', 'magnet_time', 'slow_time', 'x2_time',
                        'invincible', 'milestone_flash', 'perfect_flash',
                        'coin_frenzy_time', 'rainbow_time'];
    for (const attr of timedAttrs) {
      const t = this[attr];
      if (t > 0) this[attr] = Math.max(0.0, t - dt);
    }

    if (this.weapon_cooldown > 0) this.weapon_cooldown = Math.max(0.0, this.weapon_cooldown - dt);
    if (this.weapon_reload > 0) this.weapon_reload = Math.max(0.0, this.weapon_reload - dt);
    if (this.dash_time > 0) {
      this.dash_time -= dt;
      if (this.dash_time <= 0) this.dash_time = 0.0;
    }
    if (this.dash_cooldown > 0) this.dash_cooldown = Math.max(0.0, this.dash_cooldown - dt);
    if (this.combo_timer > 0) {
      this.combo_timer -= dt;
      if (this.combo_timer <= 0) this.combo = 0;
    }
    if (this.shake_time > 0) this.shake_time -= dt;

    if (this.ammo < WEAPON_START_AMMO) {
      this.weapon_reload += dt;
      if (this.weapon_reload >= WEAPON_RELOAD_TIME) {
        this.weapon_reload = 0.0;
        this.ammo = Math.min(WEAPON_START_AMMO, this.ammo + 1);
      }
    } else {
      this.weapon_reload = 0.0;
    }

    if (this.score >= this.next_milestone) {
      this.next_milestone += 500;
      this.lives = Math.min(this.max_lives, this.lives + 2);
      this.bonus += 100;
      this.milestone_flash = 2.0;
      playSound('milestone');
      this.spawn_particles(DINO_X + 25, this.dino_y - 40, 20,
                           ['#FFD700', '#FFFFFF', '#FFC107'], 260, 0.8);
    }

    for (const p of this.particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += p.gravity * dt;
      p.vx *= 0.98;
      p.life -= dt;
    }
    this.particles = this.particles.filter(p => p.life > 0);

    this.update_moving_platforms(dt);

    if (this.on_ground) {
      this.ducking = this.duck_wanted;
      const support = this.find_stand_support();
      if (support === null) {
        this.on_ground = false;
        this.dino_vy = 0.0;
      } else {
        this.dino_y = support;
      }
    } else {
      this.ducking = false;
      const prev_y = this.dino_y;
      this.dino_vy += GRAVITY * dt;
      this.dino_y += this.dino_vy * dt;
      const landing = this.find_landing(prev_y, this.dino_y);
      if (landing !== null) {
        this.dino_y = landing;
        this.dino_vy = 0.0;
        this.on_ground = true;
        this.jump_count = 0;
        this.spawn_particles(DINO_X + 20, this.dino_y, 4,
                             ['#cccccc', '#eeeeee'], 100, 0.3);
      } else if (this.dino_y > H + 20) {
        const wx = this.foot_wx();
        if (this.in_water(wx)) {
          this.handle_water_fall();
        } else {
          this.game_over();
          return;
        }
      }
    }

    const dx = this.speed * dt;
    for (const ob of this.obstacles) ob.wx -= dx + (ob.vx || 0) * dt;
    this.obstacles = this.obstacles.filter(o =>
      o.wx > this.distance - 260 && !this.is_hole(o.wx));

    for (const c of this.coins) c.wx -= dx;
    this.coins = this.coins.filter(c => c.wx > this.distance - 120);

    for (const g of this.gems) g.wx -= dx;
    this.gems = this.gems.filter(g => g.wx > this.distance - 120);

    for (const it of this.items) it.wx -= dx;
    this.items = this.items.filter(it => it.wx > this.distance - 80);

    for (const ap of this.ammo_pickups) ap.wx -= dx;
    this.ammo_pickups = this.ammo_pickups.filter(ap => ap.wx > this.distance - 80);

    for (const rc of this.rainbow_coins) rc.wx -= dx;
    this.rainbow_coins = this.rainbow_coins.filter(rc => rc.wx > this.distance - 120);

    for (const bp of this.bounce_pads) bp.wx -= dx;
    this.bounce_pads = this.bounce_pads.filter(bp => bp.wx > this.distance - 100);

    this.pits = this.pits.filter(p => p[1] > this.distance - 200);
    this.waters = this.waters.filter(p => p[1] > this.distance - 200);
    this.platforms = this.platforms.filter(p => p.wx + p.w / 2 > this.distance - 200);

    if (this.magnet_time > 0) {
      for (const cn of this.coins) {
        const sx = cn.wx - this.distance;
        const dxm = (DINO_X + 30) - sx;
        const dym = (this.dino_y - 30) - cn.y;
        const dist = Math.hypot(dxm, dym);
        if (dist > 1 && dist < 240) {
          const pull = 340 * dt;
          cn.wx += dxm / dist * pull;
          cn.y += dym / dist * pull;
        }
      }
    }

    this.update_bullets(dt);
    this.update_minions(dt);
    this.update_portals(dt);
    this.update_falling_rocks(dt);
    this.update_ground_spikes(dt);
    this.update_boss(dt);

    if (!this.is_boss_active()) {
      this.spawn_acc += dx;
      if (this.spawn_acc >= this.next_spawn) {
        this.spawn_acc = 0.0;
        this.next_spawn = this.speed * rand(0.95, 1.80);
        this.spawn_obstacle();
      }
      this.pit_acc += dx;
      if (this.pit_acc >= this.next_pit) {
        this.pit_acc = 0.0;
        this.next_pit = rand(1800, 3200);
        this.spawn_pit();
      }
      this.platform_acc += dx;
      if (this.platform_acc >= this.next_platform) {
        this.platform_acc = 0.0;
        this.next_platform = rand(950, 1750);
        this.spawn_platform();
      }
      this.water_acc += dx;
      if (this.water_acc >= this.next_water) {
        this.water_acc = 0.0;
        this.next_water = rand(2200, 3600);
        this.spawn_water();
      }
      this.bounce_acc += dx;
      if (this.bounce_acc >= this.next_bounce) {
        this.bounce_acc = 0.0;
        this.next_bounce = rand(1100, 1900);
        this.spawn_bounce_pad();
      }
      this.trap_acc += dx;
      if (this.trap_acc >= this.next_trap) {
        this.trap_acc = 0.0;
        this.next_trap = rand(1400, 2200);
        if (Math.random() < 0.5) this.spawn_falling_rock();
        else this.spawn_ground_spike();
      }
    }

    if (this.elapsed > 20 && Math.random() < dt * 0.9) this.spawn_minion();
    this.portal_timer -= dt;
    if (this.portal_timer <= 0) {
      this.portal_timer = PORTAL_COOLDOWN;
      this.spawn_portal();
    }

    this.coin_timer -= dt;
    if (this.coin_timer <= 0) {
      this.coin_timer = this.coin_frenzy_time > 0 ? rand(2.0, 5.5) : rand(3.0, 6.5);
      this.spawn_coins();
    }
    this.gem_timer -= dt;
    if (this.gem_timer <= 0) { this.gem_timer = rand(7.0, 12.0); this.spawn_gem(); }
    this.item_timer -= dt;
    if (this.item_timer <= 0) { this.item_timer = rand(5.0, 9.0); this.spawn_item(); }
    this.ammo_timer -= dt;
    if (this.ammo_timer <= 0) { this.ammo_timer = rand(5.0, 8.0); this.spawn_ammo_pickup(); }

    this.rainbow_timer -= dt;
    if (this.rainbow_timer <= 0) {
      this.rainbow_timer = rand(16.0, 24.0);
      this.spawn_rainbow_coin();
    }

    this.check_perfect_jumps();
    this.check_bounce_pads();
    this.check_rock_spike_collisions();
    this.check_collisions();
    this.check_achievements();
  }

  /* ================= 绘制辅助 ================= */
  poly(pts, fill, stroke, lw) {
    const c = this.ctx;
    c.beginPath();
    c.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    c.closePath();
    if (fill) { c.fillStyle = fill; c.fill(); }
    if (stroke) {
      c.strokeStyle = stroke;
      c.lineWidth = lw || 1;
      c.lineJoin = 'round';
      c.lineCap = 'round';
      c.stroke();
    }
  }
  oval(x, y, rx, ry, fill, stroke, lw) {
    const c = this.ctx;
    c.beginPath();
    c.ellipse(x, y, Math.abs(rx), Math.abs(ry), 0, 0, Math.PI * 2);
    if (fill) { c.fillStyle = fill; c.fill(); }
    if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw || 1; c.stroke(); }
  }
  rect(x1, y1, x2, y2, fill, stroke, lw) {
    const c = this.ctx;
    if (fill) { c.fillStyle = fill; c.fillRect(x1, y1, x2 - x1, y2 - y1); }
    if (stroke) {
      c.strokeStyle = stroke; c.lineWidth = lw || 1;
      c.strokeRect(x1, y1, x2 - x1, y2 - y1);
    }
  }
  line(x1, y1, x2, y2, color, lw, dash) {
    const c = this.ctx;
    c.beginPath();
    if (dash) c.setLineDash(dash); else c.setLineDash([]);
    c.moveTo(x1, y1);
    c.lineTo(x2, y2);
    c.strokeStyle = color;
    c.lineWidth = lw || 1;
    c.lineCap = 'round';
    c.stroke();
    c.setLineDash([]);
  }
  text(str, x, y, font, color, align) {
    const c = this.ctx;
    c.font = font;
    c.fillStyle = color;
    c.textAlign = align || 'left';
    c.textBaseline = 'middle';
    c.fillText(str, x, y);
  }

  /* ================= 主绘制 ================= */
  draw() {
    const c = this.ctx;
    const col = this.get_colors();
    const bg = col.bg;
    const fg_hex = col.fg_hex;

    /* ① 用当前背景色铺满整个画布（多余区域与游戏区同色，无缝） */
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = col.bg_hex;
    c.fillRect(0, 0, this.canvas.width, this.canvas.height);

    /* ② 进入 960×380 逻辑坐标系（自动适配窗口大小与 DPI） */
    const vs = this.scale * this.dpr;
    c.setTransform(vs, 0, 0, vs, this.offset_x * this.dpr, this.offset_y * this.dpr);

    let dx = 0, dy = 0;
    if (this.shake_time > 0 && this.shake_dur > 0) {
      const ratio = this.shake_time / this.shake_dur;
      const mag = this.shake_mag * ratio;
      if (mag > 0.5) { dx = rand(-mag, mag); dy = rand(-mag, mag); }
    }
    c.save();
    c.translate(dx, dy);

    c.fillStyle = col.bg_hex;
    c.fillRect(-40, -40, W + 80, H + 80);

    if (this.night > 0.45) {
      const alpha = Math.min(1.0, (this.night - 0.45) * 3.0);
      const sc = hx(mix(bg, [255, 255, 255], alpha));
      for (const s of this.stars) this.oval(s[0], s[1], s[2], s[2], sc);
    }

    this.draw_far_mountains(bg, col);
    for (const cl of this.clouds) this.draw_cloud(cl.x, cl.y, cl.s, col.cloud_hex);

    this.draw_terrain(fg_hex, col.ground_hex, col.dark_hex);
    this.draw_bounce_pads(fg_hex);
    this.draw_ground_spikes(fg_hex, col.bg_hex);
    this.draw_platforms(fg_hex);
    this.draw_decor(fg_hex);

    for (const coin of this.coins) {
      const sx = coin.wx - this.distance;
      if (-30 < sx && sx < W + 30) this.draw_coin(sx, coin.y, 11);
    }
    for (const g of this.gems) {
      const sx = g.wx - this.distance;
      if (-30 < sx && sx < W + 30) this.draw_gem(sx, g.y);
    }
    for (const rc of this.rainbow_coins) {
      const sx = rc.wx - this.distance;
      if (-40 < sx && sx < W + 40) {
        const y = rc.y + Math.sin(this.frame * 0.12 + rc.phase) * 8;
        this.draw_rainbow_coin(sx, y);
      }
    }
    for (const it of this.items) {
      const sx = it.wx - this.distance;
      if (-30 < sx && sx < W + 30) this.draw_item(it, sx);
    }
    for (const ap of this.ammo_pickups) {
      const sx = ap.wx - this.distance;
      if (-30 < sx && sx < W + 30) this.draw_ammo_pickup(ap, sx);
    }
    for (const ob of this.obstacles) {
      const sx = ob.wx - this.distance;
      if (-90 < sx && sx < W + 90) this.draw_obstacle(ob, sx, fg_hex, col.bg_hex);
    }

    this.draw_falling_rocks(fg_hex, col.bg_hex);

    for (const p of this.portals) {
      const sx = p.wx - this.distance;
      if (-60 < sx && sx < W + 60) this.draw_portal(p, sx);
    }

    this.draw_minions(fg_hex, col.bg_hex);

    if (this.boss !== null) this.draw_boss(fg_hex, col.bg_hex);
    for (const bm of this.boss_bombs) this.draw_bomb(bm);

    this.draw_dino(fg_hex, col.bg_hex);
    this.draw_bullets();

    for (const p of this.particles) {
      const r = Math.max(1, Math.floor(p.size * (0.4 + 0.6 * p.life / Math.max(0.01, p.max_life))));
      this.oval(p.x, p.y, r, r, p.color);
    }

    this.draw_weather(bg, fg_hex);
    this.draw_ui(fg_hex);

    if (this.bullet_time > 0) {
      c.fillStyle = 'rgba(0,0,51,0.12)';
      c.fillRect(0, 0, W, H);
      this.text('⏱ 子弹时间', W - 24, H - 24,
                'bold 15px "Courier New",monospace', '#FFFFFF', 'right');
    }
    if (this.rainbow_time > 0) {
      c.strokeStyle = '#FF00FF';
      c.lineWidth = 4;
      c.strokeRect(2, 2, W - 4, H - 4);
    }

    if (this.paused) {
      c.fillStyle = 'rgba(0,0,0,0.35)';
      c.fillRect(0, 0, W, H);
      this.text('已 暂 停', W / 2, H / 2 - 20,
                'bold 36px "Courier New",monospace', '#ffffff', 'center');
      this.text('按 P 继续', W / 2, H / 2 + 30,
                '16px "Courier New",monospace', '#ffffff', 'center');
    }

    c.restore();
  }

  draw_rainbow_coin(x, y) {
    const colors = ['#FF5252', '#FFC107', '#4FC3F7', '#81C784', '#E1BEE7'];
    for (let i = 0; i < colors.length; i++) {
      const rr = 15 - i * 2;
      if (rr <= 0) break;
      this.oval(x, y, rr, rr, null, colors[i], 2);
    }
    this.oval(x, y, 4, 4, '#FFFFFF');
  }

  draw_bounce_pads(fg_hex) {
    for (const bp of this.bounce_pads) {
      const sx = bp.wx - this.distance;
      if (sx < -60 || sx > W + 60) continue;
      const gy = GROUND_BASE - terrain_h(bp.wx);
      const bob = Math.sin(this.frame * 0.15 + bp.phase) * 2;
      this.rect(sx - 26, gy - 10, sx + 26, gy, '#455A64', '#263238', 1);
      this.rect(sx - 22, gy - 14 + bob, sx + 22, gy - 10 + bob, '#FFC107', '#F57F17', 2);
      this.line(sx - 18, gy - 13 + bob, sx + 18, gy - 13 + bob, '#FFF9C4', 1);
    }
  }

  draw_ground_spikes(fg_hex, bg_hex) {
    for (const sp of this.ground_spikes) {
      const sx = sp.wx - this.distance;
      if (sx < -60 || sx > W + 60) continue;
      const gy = GROUND_BASE - terrain_h(sp.wx);
      if (sp.up > 0.02) {
        const h = 34 * sp.up;
        const n = 3;
        for (let i = 0; i < n; i++) {
          const x0 = sx - 22 + i * (44 / n);
          this.poly([[x0, gy], [x0 + 44 / n / 2, gy - h], [x0 + 44 / n, gy]],
                    '#B0BEC5', '#455A64', 1);
        }
        this.line(sx - 24, gy + 1, sx + 24, gy + 1, '#FF1744', 2, [4, 3]);
      } else {
        this.line(sx - 12, gy + 1, sx + 12, gy + 1, '#FF8A80', 1, [2, 3]);
      }
    }
  }

  draw_falling_rocks(fg_hex, bg_hex) {
    for (const r of this.falling_rocks) {
      const sx = r.wx - this.distance;
      if (sx < -80 || sx > W + 80) continue;
      const gy = r.ground_y;
      if (r.state === 'warning') {
        if (Math.floor(r.timer * 10) % 2 === 0) {
          this.poly([[sx - 18, gy - 260], [sx + 18, gy - 260], [sx, gy - 220]],
                    null, '#FF1744', 3);
          this.text('!', sx, gy - 250, 'bold 14px "Courier New",monospace', '#FF1744', 'center');
        }
      } else if (r.state === 'falling' || r.state === 'landed') {
        const sy = r.sy !== null ? r.sy : 0;
        this.oval(sx, gy - 1, 22, 5, 'rgba(0,0,0,0.25)');
        this.oval(sx, sy, 22, 22, '#5D4037', '#3E2723', 2);
        this.oval(sx - 4, sy - 6, 6, 6, '#8D6E63');
      }
    }
  }

  draw_bullets() {
    for (const b of this.bullets) {
      this.oval(b.sx - 2, b.sy, 7, 5, '#FF7043');
      this.oval(b.sx - 2, b.sy, 4, 3, '#FFC107');
    }
  }

  draw_weather(bg, fg_hex) {
    const c = this.ctx;
    const w = this.weather;
    if (w.type === 'rain') {
      const rain_col = hx(mix(bg, [150, 180, 220], 0.6));
      c.strokeStyle = rain_col;
      c.lineWidth = 1;
      c.beginPath();
      for (const d of w.drops) {
        const nx = d.vx / d.vy * d.len;
        c.moveTo(d.x, d.y);
        c.lineTo(d.x + nx, d.y + d.len);
      }
      c.stroke();
    } else if (w.type === 'snow') {
      const snow_col = hx(mix(bg, [255, 255, 255], 0.8));
      c.fillStyle = snow_col;
      for (const f of w.flakes) {
        c.beginPath();
        c.ellipse(f.x, f.y, f.r, f.r, 0, 0, Math.PI * 2);
        c.fill();
      }
    } else if (w.type === 'fog') {
      const fog_col = mix(bg, [200, 200, 210], 0.35);
      c.fillStyle = 'rgba(' + fog_col[0] + ',' + fog_col[1] + ',' + fog_col[2] + ',0.45)';
      c.fillRect(0, 0, W, H);
    }
  }

  draw_far_mountains(bg, col) {
    const fg_guess = mix(DAY_FG, NIGHT_FG, this.night);
    const step = 30;

    const col1 = hx(mix(bg, fg_guess, 0.08));
    const offset1 = this.distance * 0.10;
    let pts = [];
    for (let sx = -step; sx <= W + step * 2; sx += step) {
      const wx = offset1 + sx;
      const h = 45 + 22 * Math.sin(wx * 0.0018) + 14 * Math.sin(wx * 0.0042 + 1.2);
      pts.push([sx, GROUND_BASE - 35 - h]);
    }
    pts.push([W + step * 2, GROUND_BASE]);
    pts.push([-step, GROUND_BASE]);
    this.poly(pts, col1);

    const col2 = hx(mix(bg, fg_guess, 0.15));
    const offset2 = this.distance * 0.22;
    pts = [];
    for (let sx = -step; sx <= W + step * 2; sx += step) {
      const wx = offset2 + sx;
      const h = 30 + 18 * Math.sin(wx * 0.0025 + 0.8) + 12 * Math.sin(wx * 0.0058 + 3.1);
      pts.push([sx, GROUND_BASE - 10 - h]);
    }
    pts.push([W + step * 2, GROUND_BASE]);
    pts.push([-step, GROUND_BASE]);
    this.poly(pts, col2);
  }

  draw_cloud(x, y, s, color) {
    const parts = [
      [x + 24 * s, y + 11 * s, 20 * s, 9 * s],
      [x + 42 * s, y + 6 * s, 20 * s, 16 * s],
      [x + 62 * s, y + 11 * s, 16 * s, 8 * s],
    ];
    for (const p of parts) this.oval(p[0], p[1], p[2], p[3], color);
  }

  draw_terrain(fg_hex, ground_hex, dark_hex) {
    const c = this.ctx;
    const step = 6;
    const segments = [];
    let cur = [];
    for (let sx = -step; sx <= W + step * 2; sx += step) {
      const wx = this.distance + sx;
      if (this.in_pit(wx)) {
        if (cur.length) { segments.push(cur); cur = []; }
      } else {
        cur.push([sx, GROUND_BASE - terrain_h(wx)]);
      }
    }
    if (cur.length) segments.push(cur);

    for (const seg of segments) {
      if (seg.length < 2) continue;
      let pts = seg.slice();
      pts.push([seg[seg.length - 1][0], H + 30]);
      pts.push([seg[0][0], H + 30]);
      this.poly(pts, ground_hex);

      let deeper = seg.map(p => [p[0], p[1] + 14]);
      deeper.push([seg[seg.length - 1][0], H + 30]);
      deeper.push([seg[0][0], H + 30]);
      this.poly(deeper, dark_hex);

      c.beginPath();
      c.moveTo(seg[0][0], seg[0][1]);
      for (let i = 1; i < seg.length; i++) c.lineTo(seg[i][0], seg[i][1]);
      c.strokeStyle = fg_hex;
      c.lineWidth = 3;
      c.lineJoin = 'round';
      c.lineCap = 'round';
      c.stroke();
    }

    for (const p of this.pits) {
      const sx1 = p[0] - this.distance;
      const sx2 = p[1] - this.distance;
      if (sx2 < -30 || sx1 > W + 30) continue;
      if (-30 < sx1 && sx1 < W + 30) {
        const y1 = GROUND_BASE - terrain_h(p[0]);
        this.line(sx1, y1, sx1, H, fg_hex, 4);
      }
      if (-30 < sx2 && sx2 < W + 30) {
        const y2 = GROUND_BASE - terrain_h(p[1]);
        this.line(sx2, y2, sx2, H, fg_hex, 4);
      }
    }

    const ground_rgb = unhx(ground_hex);
    const water_rgb = mix(ground_rgb, [79, 195, 247], 0.7);
    const water_dark_rgb = mix(water_rgb, [13, 71, 161], 0.4);
    const water_col = hx(water_rgb);
    const water_dark = hx(water_dark_rgb);

    for (const p of this.waters) {
      const sx1 = p[0] - this.distance;
      const sx2 = p[1] - this.distance;
      if (sx2 < -30 || sx1 > W + 30) continue;
      const y1 = GROUND_BASE - terrain_h(p[0]);
      const y2 = GROUND_BASE - terrain_h(p[1]);
      this.poly([[sx1, y1], [sx2, y2], [sx2, H], [sx1, H]], water_col);
      const wave_y = Math.min(y1, y2) + 3;
      c.strokeStyle = water_dark;
      c.lineWidth = 1;
      for (let i = 0; i <= Math.floor((sx2 - sx1) / 20); i++) {
        const wx = sx1 + i * 20 + (this.frame * 2) % 20;
        if (sx1 < wx && wx < sx2) {
          c.beginPath();
          c.arc(wx, wave_y, 9, Math.PI, 0);
          c.stroke();
        }
      }
      this.poly([[sx1, H - 10], [sx2, H - 10], [sx2, H], [sx1, H]], water_dark);
    }
  }

  draw_platforms(fg_hex) {
    for (const p of this.platforms) {
      const sx = p.wx - this.distance;
      const half = p.w / 2;
      if (sx + half < -20 || sx - half > W + 20) continue;
      const x1 = sx - half, x2 = sx + half, y = p.y;
      let fill_col = fg_hex;
      let outline_col = '#ffffff';
      if (p.moving) {
        fill_col = this.night < 0.5 ? '#4FC3F7' : '#29B6F6';
        outline_col = '#E1F5FE';
      }
      this.rect(x1, y, x2, y + 14, fill_col);
      this.line(x1, y, x2, y, outline_col, 2);
      const n = Math.max(2, Math.floor(p.w / 22));
      for (let i = 0; i < n; i++) {
        const ex = x1 + p.w * (i + 0.5) / n;
        this.line(ex, y + 14, ex, y + 20, fill_col, 2);
      }
      if (p.moving) {
        this.text('↕', sx, y + 7, 'bold 9px "Courier New",monospace', '#0D47A1', 'center');
      }
    }
  }

  draw_decor(fg_hex) {
    const spacing = 76;
    const start = Math.floor((this.distance - 40) / spacing) * spacing;
    for (let i = 0; i < Math.floor(W / spacing) + 3; i++) {
      const wx = start + i * spacing;
      const sx = wx - this.distance;
      if (sx < -30 || sx > W + 30 || this.is_hole(wx)) continue;
      const gy = GROUND_BASE - terrain_h(wx);
      const r = prand(wx, 3);
      if (r < 0.45) {
        this.line(sx - 4, gy, sx - 6, gy - 8, fg_hex, 2);
        this.line(sx + 1, gy, sx + 3, gy - 7, fg_hex, 2);
        this.line(sx + 5, gy, sx + 8, gy - 5, fg_hex, 2);
      } else if (r < 0.75) {
        this.oval(sx, gy - 1.5, 4, 3.5, fg_hex);
      }
    }
  }

  draw_coin(x, y, r) {
    this.oval(x, y, r, r, '#FFC93C', '#D89B00', 2);
    this.oval(x, y, r * 0.45, r * 0.45, '#FFE9A0');
  }

  draw_gem(x, y) {
    const r = 13;
    this.poly([[x, y - r], [x + r, y], [x, y + r], [x - r, y]], '#BA68C8', '#7B1FA2', 2);
    this.poly([[x, y - r * 0.6], [x + r * 0.5, y], [x, y + r * 0.6], [x - r * 0.5, y]], '#E1BEE7');
  }

  draw_item(it, sx) {
    const y = it.y + Math.sin(this.frame * 0.1 + it.phase) * 5;
    const r = 14;
    const color = ITEM_COLORS[it.type];
    this.oval(sx, y, r + 5, r + 5, null, color, 2);
    this.oval(sx, y, r, r, color);
    this.text(ITEM_SYMBOLS[it.type], sx, y, 'bold 14px "Courier New",monospace', 'white', 'center');
  }

  draw_ammo_pickup(ap, sx) {
    const y = ap.y + Math.sin(this.frame * 0.1 + ap.phase) * 5;
    this.rect(sx - 11, y - 11, sx + 11, y + 11, '#FFC107', '#FF8F00', 2);
    this.text('⚡', sx, y, 'bold 14px "Courier New",monospace', '#4A2400', 'center');
  }

  draw_portal(p, sx) {
    const y = p.y + Math.sin(this.frame * 0.08 + p.phase) * 6;
    for (let i = 0; i < 3; i++) {
      const r = 22 + i * 8;
      const ang = this.frame * 0.06 + i * 0.5;
      const pts = [];
      for (let k = 0; k < 8; k++) {
        const a = ang + k * Math.PI * 2 / 8;
        const rr = r * (k % 2 === 0 ? 1.0 : 0.75);
        pts.push([sx + Math.cos(a) * rr, y + Math.sin(a) * rr]);
      }
      this.poly(pts, ['#9C27B0', '#BA68C8', '#E1BEE7'][i]);
    }
  }

  draw_minions(fg_hex, bg_hex) {
    for (const m of this.minions) {
      this.oval(m.sx, m.sy, 20, 20, '#4A148C');
      this.oval(m.sx - 5, m.sy - 5, 3, 3, '#FF1744');
      this.oval(m.sx + 5, m.sy - 5, 3, 3, '#FF1744');
      const flap = Math.sin(this.frame * 0.4 + m.phase) * 8;
      this.line(m.sx - 18, m.sy - 2, m.sx - 32, m.sy - 12 - flap, '#7B1FA2', 3);
      this.line(m.sx + 18, m.sy - 2, m.sx + 32, m.sy - 12 - flap, '#7B1FA2', 3);
    }
  }

  draw_bomb(bm) {
    const r = 13;
    this.oval(bm.sx, bm.sy, r, r, '#333333', '#000000', 2);
    this.oval(bm.sx, bm.sy, r * 0.4, r * 0.4, '#FF5252');
    this.line(bm.sx + 4, bm.sy - r, bm.sx + 8, bm.sy - r - 8, '#FFC107', 2);
  }

  draw_boss(fg_hex, bg_hex) {
    const b = this.boss;
    if (!b) return;
    const c = this.ctx;
    const sx = b.sx, sy = b.sy;
    let fg = fg_hex;
    if (b.invuln > 0 && Math.floor(b.invuln * 20) % 2 === 0) fg = '#FF6F00';

    this.poly([[sx + 45, sy - 10], [sx + 130, sy - 35], [sx + 120, sy + 10]], fg);
    this.oval(sx, sy, 65, 32, fg);
    this.oval(sx - 77, sy - 19, 37, 31, fg);
    this.poly([[sx - 100, sy - 42], [sx - 165, sy - 20], [sx - 100, sy - 5]], fg);
    this.oval(sx - 81, sy - 35, 6, 7, bg_hex);
    this.oval(sx - 82, sy - 35, 2.5, 2.5, '#FF0000');

    const up = Math.floor(this.frame / 10) % 2 === 0;
    if (up) {
      this.poly([[sx - 30, sy - 20], [sx - 70, sy - 110], [sx + 50, sy - 70], [sx + 40, sy - 15]], fg);
    } else {
      this.poly([[sx - 30, sy - 20], [sx - 70, sy + 60], [sx + 50, sy + 30], [sx + 40, sy - 15]], fg);
    }

    const hp_ratio = Math.max(0, b.hp) / b.max_hp;
    const bw = 200;
    const bx = W / 2 - bw / 2;
    const by = 18;
    this.rect(bx - 2, by - 2, bx + bw + 2, by + 14, null, fg_hex, 1);
    if (hp_ratio > 0) this.rect(bx, by, bx + bw * hp_ratio, by + 12, '#FF5252');
    this.text('B O S S', W / 2, by + 28, 'bold 11px "Courier New",monospace', fg_hex, 'center');
  }

  draw_obstacle(ob, sx, fg_hex, bg_hex) {
    const gy = GROUND_BASE - terrain_h(ob.wx);
    const t = ob.type;
    if (t === 'cactus_s' || t === 'cactus_b') {
      this.draw_cactus(sx, gy, ob.w, ob.h, fg_hex);
    } else if (t === 'cactus_c') {
      const n = ob.n;
      const w = ob.w / n;
      for (let i = 0; i < n; i++) {
        const cx = sx - ob.w / 2 + w * (i + 0.5);
        const hh = ob.h * (0.82 + 0.18 * prand(ob.wx + i * 7, 9));
        this.draw_cactus(cx, gy, w * 0.95, hh, fg_hex);
      }
    } else if (t === 'spike') {
      this.draw_spike(sx, gy, ob.w, ob.h, fg_hex);
    } else if (t === 'bird') {
      this.draw_bird(sx, gy - ob.air, ob.w, ob.h, fg_hex, bg_hex);
    } else if (t === 'rock') {
      this.draw_rock(sx, gy, ob.w, ob.h, fg_hex);
    } else if (t === 'boulder') {
      this.draw_boulder(sx, gy, ob.w, fg_hex);
    } else if (t === 'pillar') {
      this.draw_pillar(sx, gy, ob.w, ob.h, fg_hex);
    } else if (t === 'pendulum') {
      this.draw_pendulum(ob, fg_hex, bg_hex);
    } else if (t === 'jumper') {
      this.draw_jumper(ob, fg_hex, bg_hex);
    } else if (t === 'saw') {
      this.draw_saw(ob, fg_hex, bg_hex);
    } else if (t === 'crate') {
      this.draw_crate(sx, gy, ob.w, ob.h, fg_hex);
    }
  }

  draw_cactus(cx, gy, w, h, fg) {
    const tw = Math.max(7.0, w * 0.34);
    this.rect(cx - tw / 2, gy - h, cx + tw / 2, gy, fg);
    const aw = w * 0.27;
    const lx = cx - tw / 2 - aw;
    const ly = gy - h * 0.58;
    this.rect(lx, ly - h * 0.26, lx + aw, ly + 3, fg);
    this.rect(lx, ly - h * 0.26, cx - tw / 2 + 1, ly - h * 0.26 + aw, fg);
    const rx = cx + tw / 2;
    const ry = gy - h * 0.72;
    this.rect(rx, ry - h * 0.24, rx + aw, ry + 3, fg);
    this.rect(rx - 1, ry - h * 0.24, rx + aw, ry - h * 0.24 + aw, fg);
  }

  draw_spike(cx, gy, w, h, fg) {
    const n = 4;
    const step = w / n;
    for (let i = 0; i < n; i++) {
      const x0 = cx - w / 2 + i * step;
      this.poly([[x0, gy], [x0 + step / 2, gy - h], [x0 + step, gy]], fg);
    }
  }

  draw_bird(sx, cy, w, h, fg, bg) {
    const up = Math.floor(this.frame / 6) % 2 === 0;
    this.oval(sx - w * 0.01, cy + h * 0.02, w * 0.27, h * 0.18, fg);
    this.oval(sx - w * 0.30, cy - h * 0.18, w * 0.18, h * 0.20, fg);
    this.poly([[sx - w * 0.46, cy - h * 0.28], [sx - w * 0.74, cy - h * 0.10],
               [sx - w * 0.46, cy]], fg);
    if (up) {
      this.poly([[sx - w * 0.04, cy - h * 0.02], [sx - w * 0.18, cy - h * 0.64],
                 [sx + w * 0.28, cy - h * 0.06]], fg);
    } else {
      this.poly([[sx - w * 0.04, cy - h * 0.02], [sx - w * 0.06, cy + h * 0.62],
                 [sx + w * 0.28, cy + h * 0.10]], fg);
    }
    this.oval(sx - w * 0.31, cy - h * 0.19, w * 0.05, h * 0.05, bg);
  }

  draw_rock(cx, gy, w, h, fg) {
    this.oval(cx, gy - h / 2 + 1, w / 2, h / 2 + 1, fg);
    this.oval(cx - w * 0.10, gy - h * 0.65, w * 0.12, h * 0.13, 'rgba(255,255,255,0.6)');
  }

  draw_boulder(cx, gy, w, fg) {
    const r = w / 2;
    const cy = gy - r;
    this.oval(cx, cy, r, r, fg);
    const ang = this.frame * 0.12;
    for (let i = 0; i < 3; i++) {
      const a = ang + i * Math.PI * 2 / 3;
      const x1 = cx + Math.cos(a) * r * 0.62;
      const y1 = cy + Math.sin(a) * r * 0.62;
      const x2 = cx + Math.cos(a + 2.2) * r * 0.62;
      const y2 = cy + Math.sin(a + 2.2) * r * 0.62;
      this.line(x1, y1, x2, y2, '#ffffff', 2);
    }
  }

  draw_pillar(cx, gy, w, h, fg) {
    this.rect(cx - w / 2, gy - h, cx + w / 2, gy, fg);
    this.rect(cx - w * 0.62, gy - h - 10, cx + w * 0.62, gy - h, fg);
    this.rect(cx - w * 0.30, gy - h * 0.7, cx + w * 0.30, gy - h * 0.62,
              'rgba(255,255,255,0.55)');
  }

  draw_pendulum(ob, fg, bg) {
    const pp = this.pendulum_pos(ob);
    const ax = pp[0], ay = pp[1], bx = pp[2], by = pp[3];
    this.line(ax, ay, bx, by, fg, 3);
    this.oval(ax, ay, 7, 7, fg);
    const r = ob.w * 0.55;
    this.oval(bx, by, r, r, fg);
    this.oval(bx, by, r * 0.4, r * 0.4, 'rgba(255,255,255,0.6)');
  }

  draw_jumper(ob, fg, bg) {
    const sx = ob.wx - this.distance;
    const cy = this.jumper_y(ob);
    const w = ob.w, h = ob.h;
    this.oval(sx, cy - h / 2, w / 2, h / 2, fg);
    this.oval(sx - w * 0.15, cy - h * 0.65, w * 0.10, h * 0.13, bg);
    this.oval(sx + w * 0.15, cy - h * 0.65, w * 0.10, h * 0.13, bg);
    this.line(sx - w * 0.30, cy, sx - w * 0.40, cy + 4, fg, 3);
    this.line(sx + w * 0.30, cy, sx + w * 0.40, cy + 4, fg, 3);
  }

  draw_saw(ob, fg, bg) {
    const cx = this.saw_x(ob);
    const gy = GROUND_BASE - terrain_h(ob.wx);
    const cy = gy - ob.h * 0.5 - 6;
    const r = ob.w * 0.5;
    const n = 12;
    const pts = [];
    const ang0 = this.frame * 0.3;
    for (let i = 0; i < n; i++) {
      const a = ang0 + i * Math.PI * 2 / n;
      const rr = i % 2 === 0 ? r : r * 0.7;
      pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
    }
    this.poly(pts, fg);
    this.oval(cx, cy, r * 0.30, r * 0.30, bg, fg, 2);
  }

  draw_crate(cx, gy, w, h, fg) {
    const x1 = cx - w / 2, x2 = cx + w / 2;
    this.rect(x1, gy - h, x2, gy, fg);
    for (let i = 0; i < 3; i++) {
      const yy = gy - h * (i + 0.5) / 3;
      this.line(x1 + 2, yy, x2 - 2, yy, 'rgba(255,255,255,0.75)', 1);
    }
    this.line(x1 + 3, gy - h + 3, x2 - 3, gy - 3, 'rgba(255,255,255,0.85)', 2);
    this.line(x1 + 3, gy - 3, x2 - 3, gy - h + 3, 'rgba(255,255,255,0.85)', 2);
